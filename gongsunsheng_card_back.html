<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>公孙胜水浒卡背面</title></head>
<body style="margin:0;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#1a1a2e">
<svg width="600" height="900" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="900" fill="#f5e6d3"/>
  <rect x="20" y="20" width="560" height="860" fill="none" stroke="#8b4513" stroke-width="8"/>
  <rect x="35" y="35" width="530" height="830" fill="none" stroke="#654321" stroke-width="3"/>
  <path d="M50 50 L100 50 L50 100 Z" fill="#8b0000"/>
  <path d="M550 50 L500 50 L550 100 Z" fill="#8b0000"/>
  <path d="M50 850 L100 850 L50 800 Z" fill="#8b0000"/>
  <path d="M550 850 L500 850 L550 800 Z" fill="#8b0000"/>
  
  <!-- 标题 -->
  <text x="300" y="80" text-anchor="middle" fill="#8b0000" font-family="serif" font-size="36" font-weight="bold">小浣熊水浒卡</text>
  <text x="300" y="120" text-anchor="middle" fill="#654321" font-family="serif" font-size="20">南方版本</text>
  
  <!-- 装饰线 -->
  <line x1="100" y1="150" x2="500" y2="150" stroke="#8b4513" stroke-width="2"/>
  
  <!-- 108 将列表背景 -->
  <rect x="80" y="180" width="440" height="500" fill="#e8d5b5" stroke="#654321" stroke-width="2" rx="10"/>
  
  <!-- 天罡星标题 -->
  <text x="300" y="220" text-anchor="middle" fill="#8b0000" font-family="serif" font-size="24" font-weight="bold">三十六天罡星</text>
  
  <!-- 天罡星列表 -->
  <text x="120" y="260" fill="#333" font-family="serif" font-size="14">1.呼保义宋江 2.玉麒麟卢俊义 3.智多星吴用</text>
  <text x="120" y="285" fill="#333" font-family="serif" font-size="14">4.入云龙公孙胜 5.大刀关胜 6.豹子头林冲</text>
  <text x="120" y="310" fill="#333" font-family="serif" font-size="14">7.霹雳火秦明 8.双鞭呼延灼 9.小李广花荣</text>
  <text x="120" y="335" fill="#333" font-family="serif" font-size="14">10.小旋风柴进 11.扑天雕李应 12.美髯公朱仝</text>
  <text x="120" y="360" fill="#333" font-family="serif" font-size="14">13.花和尚鲁智深 14.行者武松 15.双枪将董平</text>
  <text x="120" y="385" fill="#333" font-family="serif" font-size="14">16.没羽箭张清 17.青面兽杨志 18.金枪手徐宁</text>
  <text x="120" y="410" fill="#333" font-family="serif" font-size="14">19.急先锋索超 20.神行太保戴宗 21.赤发鬼刘唐</text>
  <text x="120" y="435" fill="#333" font-family="serif" font-size="14">22.黑旋风李逵 23.九纹龙史进 24.没遮拦穆弘</text>
  <text x="120" y="460" fill="#333" font-family="serif" font-size="14">25.插翅虎雷横 26.混江龙李俊 27.立地太岁阮小二</text>
  <text x="120" y="485" fill="#333" font-family="serif" font-size="14">28.船火儿张横 29.短命二郎阮小五 30.浪里白条张顺</text>
  <text x="120" y="510" fill="#333" font-family="serif" font-size="14">31.活阎罗阮小七 32.病关索杨雄 33.拼命三郎石秀</text>
  <text x="120" y="535" fill="#333" font-family="serif" font-size="14">34.两头蛇解珍 35.双尾蝎解宝 36.浪子燕青</text>
  
  <!-- 地煞星标题 -->
  <text x="300" y="580" text-anchor="middle" fill="#8b0000" font-family="serif" font-size="24" font-weight="bold">七十二地煞星</text>
  <text x="300" y="610" text-anchor="middle" fill="#654321" font-family="serif" font-size="16">（略）</text>
  
  <!-- 底部信息 -->
  <text x="300" y="730" text-anchor="middle" fill="#8b4513" font-family="serif" font-size="18" font-weight="bold">1999 年 统一小浣熊</text>
  <text x="300" y="760" text-anchor="middle" fill="#654321" font-family="serif" font-size="14">中国经典收藏卡</text>
  
  <!-- 装饰纹样 -->
  <circle cx="100" cy="800" r="15" fill="#8b0000" opacity="0.3"/>
  <circle cx="500" cy="800" r="15" fill="#8b0000" opacity="0.3"/>
  
  <text x="300" y="850" text-anchor="middle" fill="#8b4513" font-family="serif" font-size="12">本卡为收藏卡，不可食用</text>
  <text x="300" y="875" text-anchor="middle" fill="#654321" font-family="serif" font-size="12">集齐 108 将可兑换神秘大奖</text>
</svg>
</body>
</html>
