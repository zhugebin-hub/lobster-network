<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧠 心理健康测试系统</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px;
      text-align: center;
    }
    .header h1 { font-size: 28px; margin-bottom: 8px; }
    .header p { opacity: 0.9; font-size: 14px; }
    .tabs {
      display: flex;
      border-bottom: 2px solid #eee;
    }
    .tab {
      flex: 1;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: 500;
    }
    .tab:hover { background: #f8f9fa; }
    .tab.active {
      background: white;
      color: #667eea;
      border-bottom: 3px solid #667eea;
    }
    .content { padding: 30px; }
    .test-card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      cursor: pointer;
      transition: all 0.3s;
      border-left: 4px solid #667eea;
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .test-card:hover {
      transform: translateX(5px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }
    .test-icon { font-size: 36px; }
    .test-info h3 { margin-bottom: 5px; color: #333; }
    .test-info p { color: #666; font-size: 13px; }
    .test-tag {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      background: #e8e0f0;
      color: #667eea;
      margin-top: 5px;
    }
    .form-group { margin-bottom: 20px; }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      color: #333;
    }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
    }
    .form-group input:focus {
      outline: none;
      border-color: #667eea;
    }
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: all 0.3s;
    }
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
    .btn-success { background: #28a745; color: white; }
    .btn-danger { background: #dc3545; color: white; }
    .btn-sm { padding: 6px 12px; font-size: 12px; }
    .btn-block { width: 100%; }
    .progress-bar {
      height: 8px;
      background: #e0e0e0;
      border-radius: 4px;
      overflow: hidden;
      margin: 15px 0;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      transition: width 0.3s;
    }
    .question-card {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 25px;
      margin-bottom: 20px;
    }
    .question-text {
      font-size: 16px;
      font-weight: 500;
      color: #333;
      margin-bottom: 20px;
      line-height: 1.6;
    }
    .option {
      padding: 14px 18px;
      margin: 8px 0;
      background: white;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s;
      border: 2px solid transparent;
      font-size: 14px;
    }
    .option:hover { border-color: #667eea; background: #f0f4ff; }
    .option.selected { border-color: #667eea; background: #e8e0f0; font-weight: 500; }
    .result-card {
      text-align: center;
      padding: 30px;
      border-radius: 12px;
      margin: 20px 0;
      color: white;
    }
    .result-level { font-size: 28px; font-weight: bold; margin: 15px 0; }
    .result-score { font-size: 48px; font-weight: bold; }
    .result-advice {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 25px;
      margin: 20px 0;
      text-align: left;
      line-height: 1.8;
      color: #333;
    }
    .result-advice h4 {
      margin-bottom: 15px;
      color: #667eea;
    }
    .disclaimer {
      background: #fff3cd;
      border: 1px solid #ffc107;
      border-radius: 8px;
      padding: 15px;
      margin: 20px 0;
      font-size: 13px;
      color: #856404;
    }
    .hidden { display: none; }
    .result-item {
      background: #f8f9fa;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 12px;
    }
    .result-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .result-item-name { font-weight: 500; }
    .result-item-score {
      font-size: 22px;
      font-weight: bold;
    }
    .result-item-time {
      color: #999;
      font-size: 12px;
      margin-top: 8px;
    }
    .hotline {
      background: #f8d7da;
      border: 1px solid #f5c6cb;
      border-radius: 8px;
      padding: 15px;
      margin: 15px 0;
      text-align: center;
    }
    .hotline h4 { color: #721c24; margin-bottom: 8px; }
    .hotline p { color: #721c24; font-size: 14px; }
    .back-btn {
      background: none;
      border: none;
      color: #667eea;
      cursor: pointer;
      font-size: 14px;
      padding: 8px 0;
      margin-bottom: 15px;
    }
    .back-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🧠 心理健康测试系统</h1>
      <p>科学评估 · 专业建议 · 守护心灵健康</p>
    </div>

    <div class="tabs">
      <div class="tab active" onclick="switchTab('test')">📋 选择量表</div>
      <div class="tab" onclick="switchTab('history')">📊 历史记录</div>
    </div>

    <!-- 量表选择 -->
    <div id="test-panel" class="content">
      <div id="test-list"></div>
    </div>

    <!-- 测试页面 -->
    <div id="quiz-panel" class="content hidden">
      <button class="back-btn" onclick="backToTests()">← 返回量表列表</button>
      <h2 id="quiz-title" style="margin-bottom: 5px;"></h2>
      <p id="quiz-desc" style="color: #666; margin-bottom: 5px;"></p>
      <div class="form-group">
        <label>你的姓名</label>
        <input type="text" id="user-name" placeholder="请输入姓名">
      </div>
      <div id="quiz-start">
        <button class="btn btn-primary btn-block" onclick="startQuiz()">开始测试</button>
      </div>
      <div id="quiz-area" class="hidden">
        <div style="display: flex; justify-content: space-between; padding: 10px 0;">
          <span>第 <span id="current-q">1</span> / <span id="total-q">10</span> 题</span>
          <span id="quiz-test-name" style="color: #667eea;"></span>
        </div>
        <div class="progress-bar">
          <div class="progress-fill" id="progress" style="width: 0%"></div>
        </div>
        <div id="question-container"></div>
        <div style="display: flex; gap: 10px; margin-top: 20px;">
          <button class="btn" onclick="prevQuestion()" id="prev-btn" style="flex:1; background:#e0e0e0;">上一题</button>
          <button class="btn btn-primary" onclick="nextQuestion()" id="next-btn" style="flex:1;">下一题</button>
        </div>
      </div>
    </div>

    <!-- 结果页面 -->
    <div id="result-panel" class="content hidden">
      <button class="back-btn" onclick="backToTests()">← 返回量表列表</button>
      <div id="result-content"></div>
    </div>

    <!-- 历史记录 -->
    <div id="history-panel" class="content hidden">
      <h3 style="margin-bottom: 15px;">📊 测试历史记录</h3>
      <div id="history-list"></div>
    </div>
  </div>

  <script>
    const API = '';
    let tests = [];
    let currentTest = null;
    let currentAnswers = [];
    let currentQIndex = 0;
    let userName = '';

    // 切换标签
    function switchTab(tab) {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.content').forEach(p => p.classList.add('hidden'));
      event.target.classList.add('active');
      document.getElementById(tab + '-panel').classList.remove('hidden');
      if (tab === 'test') loadTests();
      if (tab === 'history') loadHistory();
    }

    // 加载量表列表
    async function loadTests() {
      const res = await fetch(API + '/api/tests');
      tests = await res.json();
      let html = '';
      tests.forEach(t => {
        html += `
          <div class="test-card" onclick="selectTest('${t.id}')">
            <div class="test-icon">${t.icon}</div>
            <div class="test-info">
              <h3>${t.name}</h3>
              <p>${t.description}</p>
              <span class="test-tag">${t.questions.length} 题</span>
              <span class="test-tag">${t.category}</span>
            </div>
          </div>
        `;
      });
      document.getElementById('test-list').innerHTML = html;
    }

    // 选择量表
    function selectTest(id) {
      currentTest = tests.find(t => t.id === id);
      document.getElementById('test-panel').classList.add('hidden');
      document.getElementById('quiz-panel').classList.remove('hidden');
      document.getElementById('quiz-title').textContent = currentTest.icon + ' ' + currentTest.name;
      document.getElementById('quiz-desc').textContent = currentTest.description;
      document.getElementById('quiz-start').classList.remove('hidden');
      document.getElementById('quiz-area').classList.add('hidden');
    }

    // 开始测试
    function startQuiz() {
      userName = document.getElementById('user-name').value.trim();
      if (!userName) return alert('请输入你的姓名');
      currentAnswers = new Array(currentTest.questions.length).fill(-1);
      currentQIndex = 0;
      document.getElementById('quiz-start').classList.add('hidden');
      document.getElementById('quiz-area').classList.remove('hidden');
      document.getElementById('total-q').textContent = currentTest.questions.length;
      document.getElementById('quiz-test-name').textContent = currentTest.name;
      showQuestion();
    }

    // 显示题目
    function showQuestion() {
      const q = currentTest.questions[currentQIndex];
      document.getElementById('current-q').textContent = currentQIndex + 1;
      document.getElementById('progress').style.width = ((currentQIndex + 1) / currentTest.questions.length * 100) + '%';

      let html = `
        <div class="question-card">
          <div class="question-text">${currentQIndex + 1}. ${q.text}</div>
          <div id="options-container">
      `;
      q.options.forEach((opt, i) => {
        const selected = currentAnswers[currentQIndex] === i ? 'selected' : '';
        html += `<div class="option ${selected}" onclick="selectOption(${i})">${opt}</div>`;
      });
      html += `</div></div>`;
      document.getElementById('question-container').innerHTML = html;

      document.getElementById('prev-btn').style.visibility = currentQIndex === 0 ? 'hidden' : 'visible';
      document.getElementById('next-btn').textContent = currentQIndex === currentTest.questions.length - 1 ? '提交' : '下一题';
    }

    // 选择选项
    function selectOption(index) {
      currentAnswers[currentQIndex] = index;
      document.querySelectorAll('.option').forEach((o, i) => {
        o.classList.toggle('selected', i === index);
      });
    }

    // 上一题
    function prevQuestion() {
      if (currentQIndex > 0) {
        currentQIndex--;
        showQuestion();
      }
    }

    // 下一题
    function nextQuestion() {
      if (currentAnswers[currentQIndex] === -1) {
        return alert('请先选择一个选项');
      }
      if (currentQIndex < currentTest.questions.length - 1) {
        currentQIndex++;
        showQuestion();
      } else {
        submitQuiz();
      }
    }

    // 提交测试
    async function submitQuiz() {
      if (!confirm('确定要提交测试结果吗？')) return;

      // 计算总分
      let totalScore = 0;
      currentTest.questions.forEach((q, i) => {
        totalScore += q.scores[currentAnswers[i]];
      });

      // 确定等级和建议
      let levelInfo = currentTest.scoring.levels[0];
      for (const level of currentTest.scoring.levels) {
        if (totalScore <= level.max) {
          levelInfo = level;
          break;
        }
      }

      // 保存结果
      await fetch(API + '/api/results', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          user_name: userName,
          test_id: currentTest.id,
          test_name: currentTest.name,
          answers: currentAnswers.map((a, i) => ({
            question: currentTest.questions[i].text,
            answer: currentTest.questions[i].options[a],
            score: currentTest.questions[i].scores[a]
          })),
          total_score: totalScore,
          level: levelInfo.level,
          advice: levelInfo.advice
        })
      });

      showResult(totalScore, levelInfo);
    }

    // 显示结果
    function showResult(score, levelInfo) {
      document.getElementById('quiz-panel').classList.add('hidden');
      document.getElementById('result-panel').classList.remove('hidden');

      let html = `
        <div class="result-card" style="background: ${levelInfo.color};">
          <div style="font-size: 16px; opacity: 0.9;">${currentTest.icon} ${currentTest.name}</div>
          <div class="result-level">${levelInfo.level}</div>
          <div class="result-score">${score} 分</div>
          <div style="font-size: 14px; opacity: 0.8; margin-top: 10px;">满分 ${currentTest.questions.reduce((sum, q) => sum + Math.max(...q.scores), 0)} 分</div>
        </div>

        <div class="disclaimer">
          ⚠️ <strong>温馨提示：</strong>本测试结果仅供参考，不能替代专业医疗诊断。如有需要，请咨询专业心理医生或心理咨询师。
        </div>

        <div class="result-advice">
          <h4>💡 个性化建议</h4>
          <p>${levelInfo.advice}</p>
        </div>
      `;

      // 严重情况显示热线
      if (levelInfo.level.includes('重度') || levelInfo.level.includes('严重')) {
        html += `
          <div class="hotline">
            <h4>🆘 心理援助热线</h4>
            <p>全国心理援助热线：<strong>400-161-9995</strong></p>
            <p>北京心理危机研究与干预中心：<strong>010-82951332</strong></p>
            <p>希望24热线：<strong>400-161-9995</strong></p>
          </div>
        `;
      }

      html += `
        <div style="margin-top: 20px;">
          <h4 style="margin-bottom: 10px;">📝 答题详情</h4>
      `;
      currentTest.questions.forEach((q, i) => {
        html += `
          <div style="padding: 10px 0; border-bottom: 1px solid #eee;">
            <strong>${i + 1}. ${q.text}</strong><br>
            <span style="color: ${levelInfo.color};">你的选择：${q.options[currentAnswers[i]]}</span>
          </div>
        `;
      });
      html += `</div>
        <button class="btn btn-primary btn-block" onclick="backToTests()" style="margin-top: 20px;">继续测试其他量表</button>
      `;

      document.getElementById('result-content').innerHTML = html;
    }

    // 返回量表列表
    function backToTests() {
      document.getElementById('quiz-panel').classList.add('hidden');
      document.getElementById('result-panel').classList.add('hidden');
      document.getElementById('test-panel').classList.remove('hidden');
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.tab')[0].classList.add('active');
    }

    // 加载历史记录
    async function loadHistory() {
      const res = await fetch(API + '/api/results');
      const results = await res.json();
      if (results.length === 0) {
        document.getElementById('history-list').innerHTML = '<p style="text-align: center; color: #999; padding: 40px;">暂无测试记录</p>';
        return;
      }
      let html = '';
      results.forEach(r => {
        html += `
          <div class="result-item">
            <div class="result-item-header">
              <div>
                <div class="result-item-name">${r.test_name}</div>
                <div style="font-size: 13px; color: #666;">${r.user_name} · ${r.level}</div>
              </div>
              <div class="result-item-score" style="color: ${r.level.includes('重度') || r.level.includes('严重') ? '#dc3545' : r.level.includes('中度') ? '#fd7e14' : '#28a745'}">
                ${r.total_score}分
              </div>
            </div>
            <div class="result-item-time">${new Date(r.created_at).toLocaleString('zh-CN')}</div>
          </div>
        `;
      });
      document.getElementById('history-list').innerHTML = html;
    }

    // 初始化
    loadTests();
  </script>
</body>
</html>
