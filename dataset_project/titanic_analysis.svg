<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <!-- 背景 -->
  <rect width="100%" height="100%" fill="#f8f9fa"/>
  
  <!-- 标题 -->
  <text x="400" y="40" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#333">泰坦尼克号数据集分析</text>
  
  <!-- 总体生存率饼图 -->
  <text x="200" y="80" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">总体生存率</text>
  
  <!-- 生存者 (绿色) -->
  <path d="M 200 150 L 200 100 A 50 50 0 0 1 238.4 118.0 Z" fill="#28a745"/>
  <path d="M 200 150 L 238.4 118.0 A 50 50 0 1 1 200 100 Z" fill="#dc3545"/>
  
  <text x="200" y="220" text-anchor="middle" font-family="Arial" font-size="14" fill="#28a745">生存：342 (38.4%)</text>
  <text x="200" y="240" text-anchor="middle" font-family="Arial" font-size="14" fill="#dc3545">遇难：549 (61.6%)</text>
  
  <!-- 性别生存率柱状图 -->
  <text x="600" y="80" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">性别生存率</text>
  
  <!-- 男性柱子 -->
  <rect x="530" y="100" width="50" height="100" fill="#007bff" opacity="0.7"/>
  <rect x="530" y="181.10918544194107" width="50" height="18.890814558058924" fill="#28a745"/>
  <text x="555" y="220" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">男性</text>
  <text x="555" y="235" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">109/577</text>
  
  <!-- 女性柱子 -->
  <rect x="620" y="100" width="50" height="100" fill="#007bff" opacity="0.7"/>
  <rect x="620" y="125.79617834394905" width="50" height="74.20382165605096" fill="#28a745"/>
  <text x="645" y="220" text-anchor="middle" font-family="Arial" font-size="12" fill="#333">女性</text>
  <text x="645" y="235" text-anchor="middle" font-family="Arial" font-size="11" fill="#555">233/314</text>
  
  <!-- 舱位统计 -->
  <text x="400" y="280" text-anchor="middle" font-family="Arial" font-size="16" fill="#555">舱位等级分布与生存率</text>
  
  <!-- 舱位柱状图 -->

  <rect x="250" y="320" width="80" height="150" fill="#007bff" opacity="0.3"/>
  <rect x="250" y="375.55555555555554" width="80" height="94.44444444444443" fill="#007bff"/>
  <text x="290" y="490" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">1等舱</text>
  <text x="290" y="510" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">136/216 (63%)</text>

  <rect x="400" y="320" width="80" height="150" fill="#28a745" opacity="0.3"/>
  <rect x="400" y="399.07608695652175" width="80" height="70.92391304347827" fill="#28a745"/>
  <text x="440" y="490" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">2等舱</text>
  <text x="440" y="510" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">87/184 (47%)</text>

  <rect x="550" y="320" width="80" height="150" fill="#dc3545" opacity="0.3"/>
  <rect x="550" y="433.64562118126275" width="80" height="36.35437881873727" fill="#dc3545"/>
  <text x="590" y="490" text-anchor="middle" font-family="Arial" font-size="14" fill="#333">3等舱</text>
  <text x="590" y="510" text-anchor="middle" font-family="Arial" font-size="12" fill="#555">119/491 (24%)</text>

  <!-- 数据摘要表格 -->
  <text x="400" y="550" text-anchor="middle" font-family="Arial" font-size="14" fill="#666">
    总乘客数：891 | 男性：577 | 女性：314 | 平均生存率：38.4%
  </text>
</svg>
