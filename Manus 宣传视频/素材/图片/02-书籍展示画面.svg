<svg width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1080" height="1920" fill="url(#bgGradient)"/>
  
  <!-- 顶部标题 -->
  <text x="540" y="120" font-family="Source Han Sans CN, sans-serif" 
        font-size="48" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    📚 Manus 智能体全攻略
  </text>
  
  <!-- 书籍封面占位框 -->
  <rect x="290" y="200" width="500" height="750" rx="12" fill="#2a2a4e" filter="url(#shadow)" stroke="#0066FF" stroke-width="2"/>
  <text x="540" y="500" font-family="sans-serif" font-size="24" fill="#888888" text-anchor="middle">
    书籍封面
  </text>
  <text x="540" y="540" font-family="sans-serif" font-size="18" fill="#666666" text-anchor="middle">
    (1000×1500px)
  </text>
  
  <!-- 章节列表 -->
  <text x="540" y="1050" font-family="Source Han Sans CN, sans-serif" 
        font-size="32" font-weight="bold" fill="#FFFFFF" text-anchor="middle">
    5 大章节
  </text>
  
  <!-- 章节项目 -->
  <g transform="translate(140, 1120)">
    <rect x="0" y="0" width="800" height="60" rx="8" fill="#0066FF" opacity="0.2"/>
    <text x="30" y="40" font-family="Source Han Sans CN, sans-serif" font-size="24" fill="#FFFFFF">
      ✅ 第 1 章 智能体与 AI 大模型
    </text>
  </g>
  
  <g transform="translate(140, 1200)">
    <rect x="0" y="0" width="800" height="60" rx="8" fill="#0066FF" opacity="0.2"/>
    <text x="30" y="40" font-family="Source Han Sans CN, sans-serif" font-size="24" fill="#FFFFFF">
      ✅ 第 2 章 开发路径与挑战
    </text>
  </g>
  
  <g transform="translate(140, 1280)">
    <rect x="0" y="0" width="800" height="60" rx="8" fill="#0066FF" opacity="0.2"/>
    <text x="30" y="40" font-family="Source Han Sans CN, sans-serif" font-size="24" fill="#FFFFFF">
      ✅ 第 3 章 功能与特性
    </text>
  </g>
  
  <g transform="translate(140, 1360)">
    <rect x="0" y="0" width="800" height="60" rx="8" fill="#0066FF" opacity="0.2"/>
    <text x="30" y="40" font-family="Source Han Sans CN, sans-serif" font-size="24" fill="#FFFFFF">
      ✅ 第 4 章 注册与使用指南
    </text>
  </g>
  
  <g transform="translate(140, 1440)">
    <rect x="0" y="0" width="800" height="60" rx="8" fill="#0066FF" opacity="0.3"/>
    <text x="30" y="40" font-family="Source Han Sans CN, sans-serif" font-size="24" fill="#FFFFFF">
      ✅ 第 5 章 实战案例
    </text>
  </g>
  
  <!-- 底部标签 -->
  <g transform="translate(140, 1600)">
    <rect x="0" y="0" width="240" height="50" rx="25" fill="#0099FF"/>
    <text x="120" y="33" font-family="Source Han Sans CN, sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">
      ✅ 配套视频
    </text>
  </g>
  
  <g transform="translate(420, 1600)">
    <rect x="0" y="0" width="240" height="50" rx="25" fill="#0099FF"/>
    <text x="120" y="33" font-family="Source Han Sans CN, sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">
      ✅ 案例回放
    </text>
  </g>
  
  <g transform="translate(700, 1600)">
    <rect x="0" y="0" width="240" height="50" rx="25" fill="#0099FF"/>
    <text x="120" y="33" font-family="Source Han Sans CN, sans-serif" font-size="20" fill="#FFFFFF" text-anchor="middle">
      ✅ 实战练习
    </text>
  </g>
  
  <!-- 时间标记 -->
  <text x="50" y="1880" font-family="Arial, sans-serif" font-size="20" fill="#666666">
    00:25 - 00:35
  </text>
</svg>
