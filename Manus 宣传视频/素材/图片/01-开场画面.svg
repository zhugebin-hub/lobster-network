<svg width="1080" height="1920" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#000000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="1080" height="1920" fill="url(#bgGradient)"/>
  
  <!-- 装饰元素 - 科技线条 -->
  <line x1="0" y1="400" x2="1080" y2="400" stroke="#0066FF" stroke-width="1" opacity="0.3"/>
  <line x1="0" y1="1520" x2="1080" y2="1520" stroke="#0066FF" stroke-width="1" opacity="0.3"/>
  
  <!-- 主标题 -->
  <text x="540" y="800" font-family="Source Han Sans CN, Microsoft YaHei, sans-serif" 
        font-size="72" font-weight="bold" fill="#FFFFFF" text-anchor="middle" filter="url(#glow)">
    人人都是开发者
  </text>
  
  <!-- 副标题 -->
  <text x="540" y="920" font-family="Source Han Sans CN, Microsoft YaHei, sans-serif" 
        font-size="42" fill="#0099FF" text-anchor="middle">
    的时代来了！
  </text>
  
  <!-- 装饰圆点 -->
  <circle cx="540" cy="700" r="8" fill="#0066FF" opacity="0.8"/>
  <circle cx="520" cy="700" r="4" fill="#0099FF" opacity="0.6"/>
  <circle cx="560" cy="700" r="4" fill="#0099FF" opacity="0.6"/>
  
  <!-- 底部提示 -->
  <text x="540" y="1700" font-family="Source Han Sans CN, Microsoft YaHei, sans-serif" 
        font-size="28" fill="#888888" text-anchor="middle">
    Manus 智能体全攻略
  </text>
  
  <!-- 时间标记 -->
  <text x="50" y="1880" font-family="Arial, sans-serif" font-size="20" fill="#666666">
    00:00 - 00:05
  </text>
</svg>
