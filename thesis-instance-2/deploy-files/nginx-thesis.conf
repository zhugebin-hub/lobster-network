##############################################################################
# 论文选题系统 — Nginx 安全加固配置
# 修复漏洞：
#   - [信息] HTTP Server 类型和版本号 → server_tokens off
#   - [低危] X-Frame-Options Header 未配置 → add_header X-Frame-Options
#   - [低危] HTTP X-Content-Type-Options 缺失 → add_header X-Content-Type-Options
#   - [低危] HTTP X-XSS-Protection 缺失 → add_header X-XSS-Protection
#   - [低危] HTTP Content-Security-Policy 缺失 → add_header Content-Security-Policy
#   - [低危] HTTP Referrer-Policy 缺失 → add_header Referrer-Policy
#   - [低危] HTTP X-Download-Options 缺失 → add_header X-Download-Options
#   - [低危] HTTP X-Permitted-Cross-Domain-Policies 缺失 → add_header X-Permitted-Cross-Domain-Policies
#   - [信息] 检测到反向代理 → 移除 upstream 标识头
#   - [中危] URL重定向 → 由应用层处理（见 Express 安全中间件）
##############################################################################

# 隐藏 Nginx 版本号（修复：HTTP Server 类型和版本号泄露）
server_tokens off;

# ---- HTTP → HTTPS 重定向（如已配置 SSL 证书则取消注释） ----
# 修复：[信息] 无HTTP重定向、[信息] 未加密的连接
# server {
#     listen 80;
#     server_name 10.20.33.63;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    # 如已配置 SSL，请改为以下两行并取消注释：
    # listen 443 ssl;
    # ssl_certificate     /etc/nginx/ssl/cert.pem;
    # ssl_certificate_key /etc/nginx/ssl/key.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5:!RC4;
    # ssl_prefer_server_ciphers on;
    # ssl_session_cache   shared:SSL:10m;
    # ssl_session_timeout 10m;

    server_name 10.20.33.63;

    # ============================================================
    # 安全响应头（修复 7 个低危漏洞 + 1 个信息漏洞）
    # ============================================================

    # 防止点击劫持（修复：X-Frame-Options Header 未配置）
    add_header X-Frame-Options "SAMEORIGIN" always;

    # 防止 MIME 类型嗅探（修复：HTTP X-Content-Type-Options 缺失）
    add_header X-Content-Type-Options "nosniff" always;

    # 启用 XSS 过滤（修复：HTTP X-XSS-Protection 缺失）
    add_header X-XSS-Protection "1; mode=block" always;

    # 内容安全策略（修复：HTTP Content-Security-Policy 缺失）
    # 策略说明：仅允许同源资源加载，允许 inline 样式（Tailwind CSS 需要），
    # 允许 data: 图片（base64图片），允许 blob: 用于文件下载
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;

    # 控制 Referer 信息泄露（修复：HTTP Referrer-Policy 缺失）
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 防止 IE 下载时直接打开文件（修复：HTTP X-Download-Options 缺失）
    add_header X-Download-Options "noopen" always;

    # 限制跨域策略文件加载（修复：HTTP X-Permitted-Cross-Domain-Policies 缺失）
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # 严格传输安全（仅在 HTTPS 启用后取消注释）
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ============================================================
    # 移除可能泄露后端信息的响应头
    # ============================================================
    proxy_hide_header X-Powered-By;

    # ============================================================
    # 请求大小限制
    # ============================================================
    client_max_body_size 50m;

    # ============================================================
    # 日志配置
    # ============================================================
    access_log /var/log/nginx/thesis-access.log;
    error_log  /var/log/nginx/thesis-error.log;

    # ============================================================
    # 反向代理到 Node.js 应用
    # ============================================================
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ============================================================
    # 静态资源缓存（前端构建产物）
    # ============================================================
    location /assets/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
        # 静态资源也需要安全头
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # ============================================================
    # 禁止访问隐藏文件（.env, .git 等）
    # ============================================================
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
