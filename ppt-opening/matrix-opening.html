<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent 三部曲 - 开场动画</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        
        #matrix-canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }
        
        #content {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            text-align: center;
            color: #0f0;
            text-shadow: 0 0 10px #0f0, 0 0 20px #0f0, 0 0 30px #0f0;
        }
        
        .title {
            font-size: 3em;
            font-weight: bold;
            opacity: 0;
            letter-spacing: 0.5em;
        }
        
        .subtitle {
            font-size: 1.5em;
            margin-top: 20px;
            opacity: 0;
            letter-spacing: 0.3em;
        }
        
        .trilogy {
            margin-top: 40px;
            opacity: 0;
        }
        
        .trilogy-item {
            font-size: 1.2em;
            margin: 15px 0;
            padding: 10px 30px;
            border: 1px solid #0f0;
            display: inline-block;
            min-width: 300px;
        }
        
        .trilogy-item .num {
            color: #0f0;
            font-weight: bold;
        }
        
        .trilogy-item .label {
            color: #0f0;
            margin-left: 10px;
        }
        
        .trilogy-item .desc {
            color: #0a0;
            font-size: 0.9em;
            margin-top: 5px;
            display: block;
        }
        
        .glitch {
            animation: glitch 0.3s infinite;
        }
        
        @keyframes glitch {
            0% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
            100% { transform: translate(0); }
        }
        
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        
        @keyframes typeWriter {
            from { width: 0; }
            to { width: 100%; }
        }
        
        .wake-up {
            position: fixed;
            top: 30%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            font-size: 2em;
            color: #0f0;
            text-shadow: 0 0 10px #0f0;
            opacity: 0;
        }
        
        .pill-choice {
            position: fixed;
            top: 60%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 50px;
            opacity: 0;
        }
        
        .pill {
            width: 60px;
            height: 30px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .pill.blue {
            background: linear-gradient(90deg, #0066ff, #0099ff);
            box-shadow: 0 0 20px #0066ff;
        }
        
        .pill.red {
            background: linear-gradient(90deg, #ff3300, #ff6600);
            box-shadow: 0 0 20px #ff3300;
        }
        
        .pill:hover {
            transform: scale(1.2);
        }
        
        .pill-label {
            position: absolute;
            color: #666;
            font-size: 0.8em;
            margin-top: 35px;
            white-space: nowrap;
        }
        
        .pill-container {
            position: relative;
            text-align: center;
        }
    </style>
</head>
<body>
    <canvas id="matrix-canvas"></canvas>
    
    <div class="wake-up" id="wakeUp">Wake Up...</div>
    
    <div id="content">
        <div class="title" id="mainTitle">AI AGENT 三部曲</div>
        <div class="subtitle" id="subTitle">从个体觉醒到生态革命</div>
        
        <div class="trilogy" id="trilogy">
            <div class="trilogy-item">
                <span class="num">HOW</span>
                <span class="label">| 怎么部署</span>
                <span class="desc">AI 员工部署教程 · 觉醒之路</span>
            </div>
            <br>
            <div class="trilogy-item">
                <span class="num">WHAT</span>
                <span class="label">| 是什么模式</span>
                <span class="desc">软件开发模式颠覆 · 认知重构</span>
            </div>
            <br>
            <div class="trilogy-item">
                <span class="num">WHY</span>
                <span class="label">| 未来愿景</span>
                <span class="desc">数百亿 Agent 社会化 · 新秩序</span>
            </div>
        </div>
    </div>
    
    <div class="pill-choice" id="pillChoice">
        <div class="pill-container">
            <div class="pill blue"></div>
            <span class="pill-label">保持现状</span>
        </div>
        <div class="pill-container">
            <div class="pill red"></div>
            <span class="pill-label">拥抱变革</span>
        </div>
    </div>

    <script>
        // Matrix Rain Effect
        const canvas = document.getElementById('matrix-canvas');
        const ctx = canvas.getContext('2d');
        
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        
        const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜｦﾝ';
        const charArray = chars.split('');
        
        const fontSize = 14;
        const columns = canvas.width / fontSize;
        const drops = [];
        
        for (let i = 0; i < columns; i++) {
            drops[i] = Math.random() * -100;
        }
        
        function drawMatrix() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#0f0';
            ctx.font = fontSize + 'px monospace';
            
            for (let i = 0; i < drops.length; i++) {
                const char = charArray[Math.floor(Math.random() * charArray.length)];
                ctx.fillText(char, i * fontSize, drops[i] * fontSize);
                
                if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
        }
        
        // Animation Sequence
        let step = 0;
        
        function showElement(element, delay = 0) {
            setTimeout(() => {
                element.style.animation = 'fadeIn 1s ease-in forwards';
            }, delay);
        }
        
        function startSequence() {
            // Step 1: Wake Up (3s)
            showElement(document.getElementById('wakeUp'), 2000);
            
            // Step 2: Main Title (5s)
            setTimeout(() => {
                document.getElementById('wakeUp').style.opacity = '0';
                showElement(document.getElementById('mainTitle'), 5000);
            }, 3000);
            
            // Step 3: Subtitle (7s)
            showElement(document.getElementById('subTitle'), 7000);
            
            // Step 4: Trilogy (10s)
            setTimeout(() => {
                showElement(document.getElementById('trilogy'), 10000);
            }, 3000);
            
            // Step 5: Pill Choice (15s)
            setTimeout(() => {
                showElement(document.getElementById('pillChoice'), 15000);
            }, 5000);
        }
        
        // Start
        setInterval(drawMatrix, 33);
        startSequence();
        
        // Handle resize
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
        
        // Click to skip
        document.addEventListener('click', () => {
            document.getElementById('content').style.opacity = '1';
            document.getElementById('pillChoice').style.opacity = '1';
        });
    </script>
</body>
</html>
