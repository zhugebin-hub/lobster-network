<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎫 大麦抢票助手</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 32px;
            max-width: 560px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 8px;
            font-size: 24px;
        }
        .subtitle {
            text-align: center;
            color: #888;
            font-size: 13px;
            margin-bottom: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 10px 14px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.2s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        .hint {
            font-size: 11px;
            color: #999;
            margin-top: 4px;
        }
        .row {
            display: flex;
            gap: 12px;
        }
        .row .form-group { flex: 1; }
        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-start {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }
        .btn-start:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-start:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-stop {
            background: #ff4757;
            color: white;
        }
        .btn-stop:hover { background: #ff3344; }
        .status-box {
            margin-top: 20px;
            padding: 16px;
            background: #f8f9fa;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.8;
            min-height: 80px;
        }
        .status-box .step { color: #667eea; font-weight: 600; }
        .status-box .success { color: #2ed573; }
        .status-box .error { color: #ff4757; }
        .status-box .warn { color: #ffa502; }
        .divider {
            height: 1px;
            background: #eee;
            margin: 20px 0;
        }
        .section-title {
            font-size: 14px;
            color: #333;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .tips {
            background: #fff8e1;
            border-left: 3px solid #ffa502;
            padding: 12px;
            border-radius: 0 8px 8px 0;
            font-size: 12px;
            color: #666;
            line-height: 1.8;
            margin-top: 16px;
        }
        .tips strong { color: #333; }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 12px 0;
        }
        .checkbox-group input { width: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎫 大麦抢票助手</h1>
        <p class="subtitle">自动刷新 · 自动填单 · 最后一步人工确认</p>

        <div class="form-group">
            <label>🔗 大麦演唱会/演出页面 URL</label>
            <input type="text" id="item_url" placeholder="https://item.damai.cn/item.htm?id=123456789">
            <div class="hint">从大麦 APP 或网页复制的演出详情页链接</div>
        </div>

        <div class="form-group">
            <label>📝 演出 ID（自动从 URL 提取）</label>
            <input type="text" id="item_id" placeholder="自动提取">
        </div>

        <div class="row">
            <div class="form-group">
                <label>🎟️ 票档 SKU ID</label>
                <input type="text" id="sku_id" placeholder="可选，留空选第一个">
                <div class="hint">在页面源码中查找 data-sku 属性</div>
            </div>
            <div class="form-group">
                <label>🔢 购票数量</label>
                <select id="count">
                    <option value="1">1 张</option>
                    <option value="2" selected>2 张</option>
                    <option value="3">3 张</option>
                </select>
            </div>
        </div>

        <div class="divider"></div>
        <div class="section-title">⏰ 抢票时间设置</div>

        <div class="row">
            <div class="form-group">
                <label>🕐 开始抢票时间</label>
                <input type="time" id="grab_time" step="1">
                <div class="hint">开票时间，留空则立即开始</div>
            </div>
            <div class="form-group">
                <label>🔄 刷新间隔（秒）</label>
                <select id="refresh_interval">
                    <option value="0.3">0.3秒（极快）</option>
                    <option value="0.5" selected>0.5秒（推荐）</option>
                    <option value="1">1秒（稳妥）</option>
                    <option value="2">2秒（安全）</option>
                </select>
            </div>
        </div>

        <div class="divider"></div>
        <div class="section-title">👤 购票人信息（可选，自动填充）</div>

        <div class="row">
            <div class="form-group">
                <label>姓名</label>
                <input type="text" id="buyer_name" placeholder="购票人姓名">
            </div>
            <div class="form-group">
                <label>手机号</label>
                <input type="text" id="buyer_phone" placeholder="手机号后4位用于匹配">
            </div>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="headless">
            <label for="headless" style="margin:0">无头模式（不显示浏览器窗口）</label>
        </div>

        <div class="btn-group">
            <button class="btn btn-start" id="startBtn" onclick="startGrab()">🚀 开始抢票</button>
            <button class="btn btn-stop" id="stopBtn" onclick="stopGrab()" style="display:none">⏹️ 停止</button>
        </div>

        <div class="status-box" id="statusBox">
            <span style="color:#999">等待开始...</span>
        </div>

        <div class="tips">
            <strong>⚠️ 使用说明：</strong><br>
            1. 填写演出 URL，系统会自动提取 ID<br>
            2. 点击"开始抢票"后，浏览器会自动打开<br>
            3. <strong>首次使用需在浏览器中手动登录大麦账号</strong><br>
            4. 到时间后自动高频刷新抢票<br>
            5. 找到票后自动填单，<strong>你只需要最后确认付款</strong><br>
            6. 建议在大麦开票前 5-10 分钟启动
        </div>
    </div>

    <script>
        // URL 自动提取 ID
        document.getElementById('item_url').addEventListener('input', function() {
            const url = this.value;
            const match = url.match(/id=(\d+)/);
            if (match) {
                document.getElementById('item_id').value = match[1];
            }
        });

        let statusInterval = null;

        function startGrab() {
            const itemId = document.getElementById('item_id').value;
            if (!itemId) {
                alert('请输入演出 URL 或 ID');
                return;
            }

            const data = {
                item_id: itemId,
                sku_id: document.getElementById('sku_id').value,
                count: document.getElementById('count').value,
                buyer_name: document.getElementById('buyer_name').value,
                buyer_phone: document.getElementById('buyer_phone').value,
                grab_time: document.getElementById('grab_time').value,
                refresh_interval: document.getElementById('refresh_interval').value,
                headless: document.getElementById('headless').checked,
            };

            fetch('/api/start', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            }).then(r => r.json()).then(data => {
                if (data.error) {
                    alert(data.error);
                } else {
                    document.getElementById('startBtn').disabled = true;
                    document.getElementById('stopBtn').style.display = 'block';
                    startStatusPolling();
                }
            });
        }

        function stopGrab() {
            fetch('/api/stop').then(() => {
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').style.display = 'none';
                if (statusInterval) clearInterval(statusInterval);
            });
        }

        function startStatusPolling() {
            if (statusInterval) clearInterval(statusInterval);
            statusInterval = setInterval(updateStatus, 1000);
        }

        function updateStatus() {
            fetch('/api/status').then(r => r.json()).then(data => {
                const box = document.getElementById('statusBox');
                let html = '';

                if (data.step === 'init') {
                    html = `<span class="step">⏳ 初始化中...</span><br>${data.message}`;
                } else if (data.step === 'browser') {
                    html = `<span class="step">🌐 浏览器</span><br>${data.message}`;
                } else if (data.step === 'login') {
                    html = `<span class="step">🔑 登录</span><br>${data.message}`;
                } else if (data.step === 'navigate') {
                    html = `<span class="step">🔗 导航</span><br>${data.message}`;
                } else if (data.step === 'waiting') {
                    html = `<span class="warn">⏰ 等待</span><br>${data.message}`;
                } else if (data.step === 'grabbing') {
                    html = `<span class="step">🔥 抢票中...</span><br>${data.message}`;
                } else if (data.step === 'found!') {
                    html = `<span class="success">🎉 ${data.message}</span>`;
                } else if (data.step === 'success') {
                    html = `<span class="success">✅ ${data.message}</span>`;
                } else if (data.step === 'error') {
                    html = `<span class="error">❌ ${data.message}</span>`;
                } else if (data.step === 'stopped') {
                    html = `<span style="color:#999">⏹️ 已停止</span>`;
                    document.getElementById('startBtn').disabled = false;
                    document.getElementById('stopBtn').style.display = 'none';
                    clearInterval(statusInterval);
                } else {
                    html = `<span class="step">${data.step}</span><br>${data.message}`;
                }

                if (data.start_time) {
                    html += `<br><span style="color:#999;font-size:11px">开始时间: ${data.start_time}</span>`;
                }

                box.innerHTML = html;
            });
        }
    </script>
</body>
</html>
