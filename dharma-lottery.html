<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>讲经交流会 · 抽签排序</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: "STKaiti", "KaiTi", "楷体", serif;
            background: linear-gradient(135deg, #1a0a00 0%, #2d1810 50%, #1a0a00 100%);
            min-height: 100vh;
            color: #f5e6d0;
            overflow-x: hidden;
        }

        /* 莲花背景装饰 */
        body::before {
            content: "🪷";
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 300px;
            opacity: 0.03;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
            position: relative;
            z-index: 1;
        }

        /* 标题区域 */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            border: 1px solid rgba(212, 175, 125, 0.3);
            border-radius: 12px;
            background: rgba(45, 24, 16, 0.6);
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 32px;
            color: #d4af7d;
            margin-bottom: 8px;
            letter-spacing: 8px;
        }

        .header .subtitle {
            font-size: 16px;
            color: #a08060;
            letter-spacing: 4px;
        }

        .lotus-divider {
            text-align: center;
            font-size: 24px;
            margin: 15px 0;
            opacity: 0.6;
        }

        /* 输入区域 */
        .input-section {
            background: rgba(45, 24, 16, 0.5);
            border: 1px solid rgba(212, 175, 125, 0.2);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .input-section h2 {
            font-size: 20px;
            color: #d4af7d;
            margin-bottom: 15px;
            text-align: center;
        }

        .name-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
            margin-bottom: 20px;
        }

        .name-input {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .name-input .num {
            color: #a08060;
            font-size: 14px;
            min-width: 20px;
        }

        .name-input input {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid rgba(212, 175, 125, 0.3);
            border-radius: 6px;
            background: rgba(26, 10, 0, 0.6);
            color: #f5e6d0;
            font-family: inherit;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .name-input input:focus {
            border-color: #d4af7d;
        }

        .name-input input::placeholder {
            color: #6a5040;
        }

        /* 按钮 */
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 40px;
            font-size: 18px;
            font-family: inherit;
            border: 2px solid #d4af7d;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 4px;
            background: transparent;
            color: #d4af7d;
        }

        .btn-primary {
            background: linear-gradient(135deg, #8b4513, #a0522d);
            color: #f5e6d0;
            border-color: #a0522d;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #a0522d, #cd853f);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(160, 82, 45, 0.4);
        }

        .btn-secondary {
            background: rgba(212, 175, 125, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(212, 175, 125, 0.2);
            transform: translateY(-2px);
        }

        /* 结果区域 */
        .result-section {
            display: none;
            background: rgba(45, 24, 16, 0.5);
            border: 1px solid rgba(212, 175, 125, 0.3);
            border-radius: 12px;
            padding: 25px;
            margin-top: 25px;
            animation: fadeIn 0.8s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-section h2 {
            font-size: 22px;
            color: #d4af7d;
            text-align: center;
            margin-bottom: 20px;
        }

        .result-list {
            list-style: none;
        }

        .result-item {
            display: flex;
            align-items: center;
            padding: 12px 18px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: rgba(26, 10, 0, 0.4);
            border-left: 3px solid #8b4513;
            animation: slideIn 0.5s ease;
            animation-fill-mode: both;
        }

        .result-item:nth-child(1) { animation-delay: 0.1s; border-left-color: #d4af7d; }
        .result-item:nth-child(2) { animation-delay: 0.2s; border-left-color: #cd853f; }
        .result-item:nth-child(3) { animation-delay: 0.3s; border-left-color: #a0522d; }
        .result-item:nth-child(n+4) { animation-delay: calc(0.3s + var(--i) * 0.05s); }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .result-order {
            font-size: 20px;
            color: #d4af7d;
            min-width: 50px;
            font-weight: bold;
        }

        .result-name {
            font-size: 18px;
            color: #f5e6d0;
            flex: 1;
        }

        .result-lotus {
            font-size: 18px;
            opacity: 0.5;
        }

        /* 抽签动画 */
        .drawing-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            z-index: 100;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .drawing-overlay.active {
            display: flex;
        }

        .drawing-text {
            font-size: 48px;
            color: #d4af7d;
            letter-spacing: 8px;
            animation: pulse 1s infinite;
        }

        .drawing-lotus {
            font-size: 80px;
            margin-bottom: 30px;
            animation: spin 2s linear infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 响应式 */
        @media (max-width: 600px) {
            .header h1 { font-size: 24px; letter-spacing: 4px; }
            .name-grid { grid-template-columns: repeat(2, 1fr); }
            .btn { padding: 12px 25px; font-size: 16px; }
            .result-order { font-size: 16px; min-width: 40px; }
            .result-name { font-size: 16px; }
        }

        /* 打印样式 */
        @media print {
            body { background: white; color: #333; }
            .input-section, .btn-group { display: none !important; }
            .result-section { display: block !important; border: 1px solid #ccc; }
            .result-item { background: white; border-left-color: #8b4513; }
            .result-order { color: #8b4513; }
            .result-name { color: #333; }
            .header { background: white; border-color: #ccc; }
            .header h1 { color: #8b4513; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- 标题 -->
        <div class="header">
            <h1>讲经交流会</h1>
            <div class="subtitle">抽 签 排 序 程 序</div>
            <div class="lotus-divider">🪷 ───── 🪷</div>
        </div>

        <!-- 输入区域 -->
        <div class="input-section">
            <h2>📿 请输入法师法号 📿</h2>
            <div class="name-grid" id="nameGrid">
                <!-- 20个输入框由JS生成 -->
            </div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="startDraw()">🪷 开 始 抽 签 🪷</button>
                <button class="btn btn-secondary" onclick="clearAll()">清 空</button>
                <button class="btn btn-secondary" onclick="printResult()">打 印</button>
            </div>
        </div>

        <!-- 结果区域 -->
        <div class="result-section" id="resultSection">
            <h2>🪷 讲 经 顺 序 🪷</h2>
            <div class="lotus-divider">🪷 ───── 🪷</div>
            <ul class="result-list" id="resultList"></ul>
        </div>
    </div>

    <!-- 抽签动画 -->
    <div class="drawing-overlay" id="drawingOverlay">
        <div class="drawing-lotus">🪷</div>
        <div class="drawing-text">诚 心 抽 签 中</div>
    </div>

    <script>
        // 生成20个输入框
        const nameGrid = document.getElementById('nameGrid');
        for (let i = 1; i <= 20; i++) {
            const div = document.createElement('div');
            div.className = 'name-input';
            div.innerHTML = `
                <span class="num">${i}.</span>
                <input type="text" id="name${i}" placeholder="法师法号" maxlength="10">
            `;
            nameGrid.appendChild(div);
        }

        // 洗牌算法 (Fisher-Yates)
        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        // 开始抽签
        function startDraw() {
            // 收集所有填写的法号
            const names = [];
            for (let i = 1; i <= 20; i++) {
                const val = document.getElementById(`name${i}`).value.trim();
                if (val) names.push(val);
            }

            if (names.length < 2) {
                alert('请至少输入2位法师的法号');
                return;
            }

            // 显示动画
            const overlay = document.getElementById('drawingOverlay');
            overlay.classList.add('active');

            // 2秒后显示结果
            setTimeout(() => {
                overlay.classList.remove('active');
                showResult(names);
            }, 2000);
        }

        // 显示结果
        function showResult(names) {
            const shuffled = shuffle(names);
            const resultList = document.getElementById('resultList');
            const resultSection = document.getElementById('resultSection');
            
            resultList.innerHTML = '';
            
            shuffled.forEach((name, index) => {
                const li = document.createElement('li');
                li.className = 'result-item';
                li.style.setProperty('--i', index);
                li.innerHTML = `
                    <span class="result-order">第${index + 1}位</span>
                    <span class="result-name">${name}</span>
                    <span class="result-lotus">🪷</span>
                `;
                resultList.appendChild(li);
            });

            resultSection.style.display = 'block';
            resultSection.scrollIntoView({ behavior: 'smooth' });
        }

        // 清空
        function clearAll() {
            for (let i = 1; i <= 20; i++) {
                document.getElementById(`name${i}`).value = '';
            }
            document.getElementById('resultSection').style.display = 'none';
        }

        // 打印
        function printResult() {
            window.print();
        }
    </script>
</body>
</html>
