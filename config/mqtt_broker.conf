# 小龙虾网络 MQTT Broker 配置
# Mosquitto v1.6.15 | 诸葛马 (教练端) 172.24.57.34

# 禁用默认监听器，只使用自定义监听器
port 1883
protocol mqtt

# 绑定地址 (IPv4 only)
bind_address 0.0.0.0
allow_anonymous true

persistence true
persistence_location /home/admin/go-training/shared/mqtt_data/

log_type error
log_type warning
log_type notice
log_type information
log_dest stdout

max_connections 100
