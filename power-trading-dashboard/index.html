<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>电力调度与电价期货交易分析平台</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #fff;
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(90deg, #0f3460 0%, #16213e 100%);
            padding: 20px 40px;
            border-bottom: 2px solid #e94560;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 28px;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }
        
        .header .time {
            font-size: 14px;
            color: #a0a0a0;
        }
        
        .container {
            padding: 20px;
            max-width: 1920px;
            margin: 0 auto;
        }
        
        .kpi-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .kpi-card {
            background: linear-gradient(145deg, #1f4068 0%, #162447 100%);
            border-radius: 12px;
            padding: 25px;
            border: 1px solid rgba(233, 69, 96, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .kpi-card h3 {
            font-size: 14px;
            color: #a0a0a0;
            margin-bottom: 10px;
        }
        
        .kpi-card .value {
            font-size: 32px;
            font-weight: bold;
            color: #e94560;
        }
        
        .kpi-card .change {
            font-size: 12px;
            margin-top: 8px;
        }
        
        .kpi-card .change.up {
            color: #00d26a;
        }
        
        .kpi-card .change.down {
            color: #ff6b6b;
        }
        
        .chart-row {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .chart-card {
            background: linear-gradient(145deg, #1f4068 0%, #162447 100%);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(233, 69, 96, 0.3);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .chart-card h3 {
            font-size: 16px;
            color: #e94560;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(233, 69, 96, 0.3);
        }
        
        .chart-container {
            height: 350px;
        }
        
        .full-width {
            grid-column: 1 / -1;
        }
        
        .trading-panel {
            background: linear-gradient(145deg, #1f4068 0%, #162447 100%);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid rgba(233, 69, 96, 0.3);
            margin-bottom: 20px;
        }
        
        .trading-panel h3 {
            font-size: 16px;
            color: #e94560;
            margin-bottom: 15px;
        }
        
        .trading-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
        }
        
        .contract-item {
            background: rgba(233, 69, 96, 0.1);
            border-radius: 8px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }
        
        .contract-item:hover {
            background: rgba(233, 69, 96, 0.2);
            border-color: #e94560;
        }
        
        .contract-item.active {
            background: rgba(233, 69, 96, 0.3);
            border-color: #e94560;
        }
        
        .contract-item .name {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        
        .contract-item .price {
            font-size: 20px;
            color: #00d26a;
        }
        
        .contract-item .change {
            font-size: 12px;
            margin-top: 5px;
        }
        
        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .btn-buy {
            background: linear-gradient(135deg, #00d26a 0%, #00a862 100%);
            color: #fff;
        }
        
        .btn-sell {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            color: #fff;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }
        
        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        
        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .data-table th {
            background: rgba(233, 69, 96, 0.2);
            color: #e94560;
            font-weight: bold;
        }
        
        .data-table tr:hover {
            background: rgba(233, 69, 96, 0.1);
        }
        
        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        
        .status-badge.normal {
            background: rgba(0, 210, 106, 0.2);
            color: #00d26a;
        }
        
        .status-badge.warning {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }
        
        .status-badge.critical {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
        }
        
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .tab {
            padding: 10px 25px;
            background: rgba(233, 69, 96, 0.2);
            border: 1px solid rgba(233, 69, 96, 0.3);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .tab.active {
            background: rgba(233, 69, 96, 0.4);
            border-color: #e94560;
        }
        
        .tab:hover {
            background: rgba(233, 69, 96, 0.3);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>⚡ 电力调度与电价期货交易分析平台</h1>
        <div class="time" id="currentTime"></div>
    </div>
    
    <div class="container">
        <!-- KPI 指标 -->
        <div class="kpi-row">
            <div class="kpi-card">
                <h3>实时负荷 (MW)</h3>
                <div class="value" id="loadValue">45,280</div>
                <div class="change up">↑ 3.2% 较昨日</div>
            </div>
            <div class="kpi-card">
                <h3>电价指数 (元/MWh)</h3>
                <div class="value" id="priceValue">568.50</div>
                <div class="change down">↓ 1.8% 较开盘</div>
            </div>
            <div class="kpi-card">
                <h3>期货持仓量 (手)</h3>
                <div class="value" id="positionValue">128,450</div>
                <div class="change up">↑ 5.6% 较昨日</div>
            </div>
            <div class="kpi-card">
                <h3>日交易量 (亿元)</h3>
                <div class="value" id="volumeValue">23.8</div>
                <div class="change up">↑ 12.3% 较昨日</div>
            </div>
        </div>
        
        <!-- 交易面板 -->
        <div class="trading-panel">
            <h3>📊 电价期货合约</h3>
            <div class="trading-grid" id="contractGrid">
                <!-- 动态生成合约 -->
            </div>
            <div class="action-buttons">
                <button class="btn btn-buy" onclick="executeTrade('buy')">买入做多</button>
                <button class="btn btn-sell" onclick="executeTrade('sell')">卖出做空</button>
            </div>
        </div>
        
        <!-- 图表第一行 -->
        <div class="chart-row">
            <div class="chart-card">
                <h3>📈 24 小时电力负荷与电价趋势</h3>
                <div class="chart-container" id="loadPriceChart"></div>
            </div>
            <div class="chart-card">
                <h3>📊 期货合约成交量分布</h3>
                <div class="chart-container" id="volumeChart"></div>
            </div>
        </div>
        
        <!-- 图表第二行 -->
        <div class="chart-row">
            <div class="chart-card">
                <h3>🌡️ 区域电力供需热力图</h3>
                <div class="chart-container" id="heatmapChart"></div>
            </div>
            <div class="chart-card">
                <h3>📉 电价波动率分析</h3>
                <div class="chart-container" id="volatilityChart"></div>
            </div>
        </div>
        
        <!-- 图表第三行 - 全宽 -->
        <div class="chart-row">
            <div class="chart-card full-width">
                <h3>📋 实时交易记录</h3>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>时间</th>
                            <th>合约</th>
                            <th>方向</th>
                            <th>价格 (元/MWh)</th>
                            <th>数量 (手)</th>
                            <th>金额 (万元)</th>
                            <th>状态</th>
                        </tr>
                    </thead>
                    <tbody id="tradeTable">
                        <!-- 动态生成交易记录 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script>
        // 更新时间
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleString('zh-CN', {
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }
        setInterval(updateTime, 1000);
        updateTime();
        
        // 模拟数据
        const contracts = [
            { name: 'ELEC-2024Q2', price: 568.50, change: -1.8 },
            { name: 'ELEC-2024Q3', price: 592.30, change: 2.3 },
            { name: 'ELEC-2024Q4', price: 615.80, change: 3.5 },
            { name: 'ELEC-2025Q1', price: 548.20, change: -0.5 },
            { name: 'ELEC-2025Q2', price: 575.60, change: 1.2 }
        ];
        
        // 渲染合约
        function renderContracts() {
            const grid = document.getElementById('contractGrid');
            grid.innerHTML = contracts.map((c, i) => `
                <div class="contract-item ${i === 0 ? 'active' : ''}" onclick="selectContract(${i})">
                    <div class="name">${c.name}</div>
                    <div class="price">${c.price.toFixed(2)}</div>
                    <div class="change ${c.change >= 0 ? 'up' : 'down'}">
                        ${c.change >= 0 ? '↑' : '↓'} ${Math.abs(c.change)}%
                    </div>
                </div>
            `).join('');
        }
        renderContracts();
        
        // 选择合约
        function selectContract(index) {
            document.querySelectorAll('.contract-item').forEach((item, i) => {
                item.classList.toggle('active', i === index);
            });
        }
        
        // 执行交易
        function executeTrade(type) {
            alert(`${type === 'buy' ? '买入' : '卖出'}订单已提交！`);
        }
        
        // ECharts 初始化
        const loadPriceChart = echarts.init(document.getElementById('loadPriceChart'));
        const volumeChart = echarts.init(document.getElementById('volumeChart'));
        const heatmapChart = echarts.init(document.getElementById('heatmapChart'));
        const volatilityChart = echarts.init(document.getElementById('volatilityChart'));
        
        // 24 小时负荷与电价趋势
        const loadPriceOption = {
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'cross' }
            },
            legend: {
                data: ['电力负荷 (MW)', '电价 (元/MWh)'],
                textStyle: { color: '#a0a0a0' }
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                data: ['00:00', '03:00', '06:00', '09:00', '12:00', '15:00', '18:00', '21:00'],
                axisLine: { lineStyle: { color: '#a0a0a0' } }
            },
            yAxis: [
                {
                    type: 'value',
                    name: '负荷 (MW)',
                    axisLine: { lineStyle: { color: '#e94560' } },
                    axisLabel: { color: '#a0a0a0' }
                },
                {
                    type: 'value',
                    name: '电价 (元/MWh)',
                    axisLine: { lineStyle: { color: '#00d26a' } },
                    axisLabel: { color: '#a0a0a0' }
                }
            ],
            series: [
                {
                    name: '电力负荷 (MW)',
                    type: 'line',
                    data: [32000, 28000, 35000, 48000, 52000, 49000, 55000, 42000],
                    smooth: true,
                    itemStyle: { color: '#e94560' },
                    areaStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: 'rgba(233, 69, 96, 0.5)' },
                            { offset: 1, color: 'rgba(233, 69, 96, 0.1)' }
                        ])
                    }
                },
                {
                    name: '电价 (元/MWh)',
                    type: 'line',
                    yAxisIndex: 1,
                    data: [420, 380, 450, 580, 620, 590, 680, 520],
                    smooth: true,
                    itemStyle: { color: '#00d26a' }
                }
            ]
        };
        loadPriceChart.setOption(loadPriceOption);
        
        // 成交量分布
        const volumeOption = {
            tooltip: {
                trigger: 'item',
                formatter: '{a} <br/>{b}: {c} ({d}%)'
            },
            legend: {
                orient: 'vertical',
                right: '10%',
                top: 'center',
                textStyle: { color: '#a0a0a0' }
            },
            series: [
                {
                    name: '成交量',
                    type: 'pie',
                    radius: ['40%', '70%'],
                    center: ['35%', '50%'],
                    itemStyle: {
                        borderRadius: 10,
                        borderColor: '#162447',
                        borderWidth: 2
                    },
                    label: {
                        color: '#fff'
                    },
                    data: [
                        { value: 35, name: 'ELEC-2024Q2', itemStyle: { color: '#e94560' } },
                        { value: 28, name: 'ELEC-2024Q3', itemStyle: { color: '#00d26a' } },
                        { value: 22, name: 'ELEC-2024Q4', itemStyle: { color: '#ffc107' } },
                        { value: 10, name: 'ELEC-2025Q1', itemStyle: { color: '#00bcd4' } },
                        { value: 5, name: 'ELEC-2025Q2', itemStyle: { color: '#9c27b0' } }
                    ]
                }
            ]
        };
        volumeChart.setOption(volumeOption);
        
        // 区域供需热力图
        const heatmapOption = {
            tooltip: {
                position: 'top',
                formatter: function(params) {
                    return params.data[2] + '<br/>负荷：' + params.data[3] + ' MW<br/>缺口：' + params.data[4] + ' MW';
                }
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                data: ['杭州', '宁波', '温州', '嘉兴', '湖州', '绍兴', '金华', '台州'],
                axisLine: { lineStyle: { color: '#a0a0a0' } },
                axisLabel: { color: '#a0a0a0' }
            },
            yAxis: {
                type: 'category',
                data: ['发电侧', '电网侧', '用户侧'],
                axisLine: { lineStyle: { color: '#a0a0a0' } },
                axisLabel: { color: '#a0a0a0' }
            },
            visualMap: {
                min: 0,
                max: 100,
                calculable: true,
                orient: 'horizontal',
                left: 'center',
                bottom: '0%',
                inRange: {
                    color: ['#00d26a', '#ffc107', '#ff6b6b']
                },
                textStyle: { color: '#a0a0a0' }
            },
            series: [{
                name: '供需指数',
                type: 'heatmap',
                data: [
                    [0, 0, 85, 12000, 1500], [0, 1, 72, 8500, -800], [0, 2, 90, 15000, 2000],
                    [1, 0, 78, 10500, 1200], [1, 1, 65, 7200, -500], [1, 2, 82, 13000, 1800],
                    [2, 0, 68, 8800, 800], [2, 1, 55, 5500, -1200], [2, 2, 75, 11000, 1500],
                    [3, 0, 82, 11500, 1400], [3, 1, 70, 8000, -600], [3, 2, 88, 14500, 1900],
                    [4, 0, 75, 9500, 1000], [4, 1, 62, 6800, -700], [4, 2, 80, 12500, 1600],
                    [5, 0, 88, 12800, 1600], [5, 1, 76, 9000, -900], [5, 2, 92, 15500, 2100],
                    [6, 0, 70, 9000, 900], [6, 1, 58, 6200, -1000], [6, 2, 78, 12000, 1700],
                    [7, 0, 72, 9200, 950], [7, 1, 60, 6500, -850], [7, 2, 80, 12200, 1650]
                ].map(item => [item[0], item[1], item[2], item[3], item[4]]),
                label: {
                    show: true,
                    color: '#fff'
                }
            }]
        };
        heatmapChart.setOption(heatmapOption);
        
        // 波动率分析
        const volatilityOption = {
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'cross' }
            },
            grid: {
                left: '3%',
                right: '4%',
                bottom: '3%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                data: ['周一', '周二', '周三', '周四', '周五', '周六', '周日'],
                axisLine: { lineStyle: { color: '#a0a0a0' } },
                axisLabel: { color: '#a0a0a0' }
            },
            yAxis: {
                type: 'value',
                name: '波动率 (%)',
                axisLine: { lineStyle: { color: '#a0a0a0' } },
                axisLabel: { color: '#a0a0a0' },
                splitLine: {
                    lineStyle: {
                        color: 'rgba(255, 255, 255, 0.1)'
                    }
                }
            },
            series: [
                {
                    name: '日内波动率',
                    type: 'bar',
                    data: [3.2, 4.5, 2.8, 5.1, 3.9, 2.5, 3.0],
                    itemStyle: {
                        color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                            { offset: 0, color: '#e94560' },
                            { offset: 1, color: 'rgba(233, 69, 96, 0.3)' }
                        ])
                    }
                },
                {
                    name: '历史波动率',
                    type: 'line',
                    data: [3.5, 3.8, 3.6, 4.0, 3.7, 3.5, 3.6],
                    smooth: true,
                    itemStyle: { color: '#00d26a' },
                    lineStyle: { width: 3 }
                }
            ]
        };
        volatilityChart.setOption(volatilityOption);
        
        // 交易记录
        const trades = [
            { time: '10:45:32', contract: 'ELEC-2024Q2', direction: '买入', price: 568.50, volume: 500, amount: 284.25, status: '成交' },
            { time: '10:42:18', contract: 'ELEC-2024Q3', direction: '卖出', price: 592.30, volume: 300, amount: 177.69, status: '成交' },
            { time: '10:38:55', contract: 'ELEC-2024Q2', direction: '买入', price: 565.20, volume: 800, amount: 452.16, status: '成交' },
            { time: '10:35:41', contract: 'ELEC-2024Q4', direction: '买入', price: 615.80, volume: 450, amount: 277.11, status: ' pending' },
            { time: '10:32:09', contract: 'ELEC-2025Q1', direction: '卖出', price: 548.20, volume: 600, amount: 328.92, status: '成交' }
        ];
        
        function renderTrades() {
            const tbody = document.getElementById('tradeTable');
            tbody.innerHTML = trades.map(t => `
                <tr>
                    <td>${t.time}</td>
                    <td>${t.contract}</td>
                    <td style="color: ${t.direction === '买入' ? '#00d26a' : '#ff6b6b'}">${t.direction}</td>
                    <td>${t.price.toFixed(2)}</td>
                    <td>${t.volume}</td>
                    <td>${t.amount.toFixed(2)}</td>
                    <td><span class="status-badge ${t.status === '成交' ? 'normal' : 'warning'}">${t.status}</span></td>
                </tr>
            `).join('');
        }
        renderTrades();
        
        // 响应式调整
        window.addEventListener('resize', () => {
            loadPriceChart.resize();
            volumeChart.resize();
            heatmapChart.resize();
            volatilityChart.resize();
        });
        
        // 模拟数据更新
        setInterval(() => {
            const loadValue = document.getElementById('loadValue');
            const currentLoad = parseInt(loadValue.textContent.replace(/,/g, ''));
            const newLoad = currentLoad + Math.floor(Math.random() * 200 - 100);
            loadValue.textContent = newLoad.toLocaleString();
            
            const priceValue = document.getElementById('priceValue');
            const currentPrice = parseFloat(priceValue.textContent);
            const newPrice = currentPrice + (Math.random() * 4 - 2);
            priceValue.textContent = newPrice.toFixed(2);
        }, 3000);
    </script>
</body>
</html>
