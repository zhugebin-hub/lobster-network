<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦞 小龙虾网络抽奖 - 管理员后台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            padding: 40px 20px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .card h2 {
            color: #333;
            margin-bottom: 20px;
            font-size: 1.5em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 24px;
            border-radius: 12px;
            text-align: center;
        }

        .stat-number {
            font-size: 3em;
            font-weight: 800;
            margin: 10px 0;
        }

        .stat-label {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .data-table th,
        .data-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .data-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #333;
        }

        .data-table tr:hover {
            background: #f8f9fa;
        }

        .btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: linear-gradient(135deg, #ff4757 0%, #ff3344 100%);
        }

        .btn-success {
            background: linear-gradient(135deg, #34d399 0%, #22c55e 100%);
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin: 20px 0;
        }

        .login-form {
            max-width: 400px;
            margin: 100px auto;
            padding: 40px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .login-form h2 {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .status-registering {
            background: #34d399;
            color: white;
        }

        .status-drawing {
            background: #ffd700;
            color: #333;
        }

        .status-completed {
            background: #ff4757;
            color: white;
        }

        .hidden {
            display: none;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #333;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            z-index: 1000;
            animation: fadeInOut 2s ease-in-out;
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
            20% { opacity: 1; transform: translateX(-50%) translateY(0); }
            80% { opacity: 1; }
            100% { opacity: 0; transform: translateX(-50%) translateY(-20px); }
        }

        .export-btn {
            background: #22d3ee;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .data-table {
                font-size: 14px;
            }
            
            .btn-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🦞 小龙虾网络抽奖 - 管理员后台</h1>
            <p>数据管理与统计中心</p>
        </div>

        <!-- 登录页面 -->
        <div id="loginPage" class="login-form">
            <h2>🔐 管理员登录</h2>
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">用户名</label>
                    <input type="text" id="username" required placeholder="请输入管理员用户名">
                </div>
                <div class="form-group">
                    <label for="password">密码</label>
                    <input type="password" id="password" required placeholder="请输入管理员密码">
                </div>
                <button type="submit" class="btn" style="width: 100%;">登录</button>
            </form>
            <p style="text-align: center; margin-top: 20px; color: #999; font-size: 0.9em;">
                默认用户名：admin<br>
                默认密码：lottery2026
            </p>
        </div>

        <!-- 管理后台 -->
        <div id="adminPanel" class="hidden">
            <div class="card">
                <h2>📊 数据统计</h2>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-label">报名总人数</div>
                        <div class="stat-number" id="totalParticipants">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">中奖人数</div>
                        <div class="stat-number" id="totalWinners">0</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">剩余名额</div>
                        <div class="stat-number" id="remainingSlots">10</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-label">当前状态</div>
                        <div class="stat-number" style="font-size: 1.5em;" id="currentStatus">报名中</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>📝 报名人员列表</h2>
                <div class="btn-group">
                    <button class="btn" onclick="refreshData()">🔄 刷新数据</button>
                    <button class="export-btn" onclick="exportData()">📥 导出数据</button>
                    <button class="btn btn-danger" onclick="clearAllData()">🗑️ 清空数据</button>
                </div>
                <div style="overflow-x: auto;">
                    <table class="data-table" id="participantsTable">
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>姓名</th>
                                <th>电话</th>
                                <th>地址</th>
                                <th>报名时间</th>
                                <th>状态</th>
                            </tr>
                        </thead>
                        <tbody id="participantsBody">
                            <tr>
                                <td colspan="6" style="text-align: center; color: #999; padding: 40px;">
                                    暂无数据
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <h2>🏆 中奖名单</h2>
                <div style="overflow-x: auto;">
                    <table class="data-table" id="winnersTable">
                        <thead>
                            <tr>
                                <th>序号</th>
                                <th>姓名</th>
                                <th>电话</th>
                                <th>地址</th>
                                <th>中奖时间</th>
                            </tr>
                        </thead>
                        <tbody id="winnersBody">
                            <tr>
                                <td colspan="5" style="text-align: center; color: #999; padding: 40px;">
                                    暂无中奖者
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <h2>⚙️ 系统设置</h2>
                <div class="btn-group">
                    <button class="btn btn-success" onclick="startDrawing()">🎰 开始开奖</button>
                    <button class="btn btn-danger" onclick="resetLottery()">🔄 重置抽奖</button>
                    <button class="btn" onclick="logout()">🚪 退出登录</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 管理员配置
        const ADMIN_USERNAME = 'admin';
        const ADMIN_PASSWORD = 'lottery2026';
        
        // 数据存储 - 使用 API 作为主存储
        let lotteryData = {
            participants: [],
            winners: [],
            status: 'registering',
            lastUpdated: null
        };
        
        // API 基础 URL
        const API_BASE = window.location.origin;

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            checkLoginStatus();
        });

        // 登录表单
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                localStorage.setItem('admin_logged_in', 'true');
                showAdminPanel();
                loadLotteryData();
                showToast('登录成功！');
            } else {
                showToast('用户名或密码错误');
            }
        });

        // 检查登录状态
        function checkLoginStatus() {
            if (localStorage.getItem('admin_logged_in') === 'true') {
                showAdminPanel();
                loadLotteryData();
            }
        }

        // 显示管理后台
        function showAdminPanel() {
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('adminPanel').classList.remove('hidden');
            loadLotteryData();
        }

        // 退出登录
        function logout() {
            localStorage.removeItem('admin_logged_in');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('adminPanel').classList.add('hidden');
            showToast('已退出登录');
        }

        // 加载抽奖数据 - 从 API
        async function loadLotteryData() {
            try {
                const response = await fetch(`${API_BASE}/api/data`);
                const data = await response.json();
                lotteryData = data;
                updateUI();
            } catch (error) {
                console.error('加载数据失败:', error);
                showToast('加载数据失败');
            }
        }

        // 保存抽奖数据 - 通过 API
        async function saveLotteryData() {
            try {
                // 更新状态
                await fetch(`${API_BASE}/api/status`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ status: lotteryData.status })
                });
                
                lotteryData.lastUpdated = new Date().toISOString();
                updateUI();
                showToast('数据保存成功');
            } catch (error) {
                console.error('保存数据失败:', error);
                showToast('保存数据失败');
            }
        }

        // 更新UI
        function updateUI() {
            document.getElementById('totalParticipants').textContent = lotteryData.participants.length;
            document.getElementById('totalWinners').textContent = lotteryData.winners.length;
            document.getElementById('remainingSlots').textContent = Math.max(0, 10 - lotteryData.winners.length);
            
            const statusText = {
                'registering': '报名中',
                'drawing': '开奖中',
                'completed': '已完成'
            };
            document.getElementById('currentStatus').textContent = statusText[lotteryData.status] || '未知';
            
            // 更新报名人员列表
            const participantsBody = document.getElementById('participantsBody');
            if (lotteryData.participants.length === 0) {
                participantsBody.innerHTML = '<tr><td colspan="6" style="text-align: center; color: #999; padding: 40px;">暂无数据</td></tr>';
            } else {
                participantsBody.innerHTML = lotteryData.participants.map((p, index) => `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${p.name}</td>
                        <td>${p.phone}</td>
                        <td>${p.address}</td>
                        <td>${new Date(p.registeredAt).toLocaleString('zh-CN')}</td>
                        <td>
                            ${lotteryData.winners.some(w => w.id === p.id) ? 
                                '<span class="status-badge status-drawing">已中奖</span>' : 
                                '<span class="status-badge status-registering">已报名</span>'}
                        </td>
                    </tr>
                `).join('');
            }
            
            // 更新中奖名单
            const winnersBody = document.getElementById('winnersBody');
            if (lotteryData.winners.length === 0) {
                winnersBody.innerHTML = '<tr><td colspan="5" style="text-align: center; color: #999; padding: 40px;">暂无中奖者</td></tr>';
            } else {
                winnersBody.innerHTML = lotteryData.winners.map((w, index) => `
                    <tr>
                        <td>${index + 1}</td>
                        <td>${w.name}</td>
                        <td>${w.phone}</td>
                        <td>${w.address}</td>
                        <td>${new Date(w.wonAt).toLocaleString('zh-CN')}</td>
                    </tr>
                `).join('');
            }
        }

        // 刷新数据
        function refreshData() {
            loadLotteryData();
            showToast('数据刷新中...');
        }

        // 导出数据
        async function exportData() {
            try {
                const response = await fetch(`${API_BASE}/api/export`);
                const data = await response.json();
                const dataStr = JSON.stringify(data, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `lottery-data-${new Date().toISOString().split('T')[0]}.json`;
                link.click();
                showToast('数据导出成功');
            } catch (error) {
                console.error('导出数据失败:', error);
                showToast('导出数据失败');
            }
        }

        // 清空数据
        async function clearAllData() {
            if (confirm('确定要清空所有数据吗？此操作不可恢复！')) {
                try {
                    await fetch(`${API_BASE}/api/data`, {
                        method: 'DELETE'
                    });
                    lotteryData = {
                        participants: [],
                        winners: [],
                        status: 'registering',
                        lastUpdated: new Date().toISOString()
                    };
                    updateUI();
                    showToast('数据已清空');
                } catch (error) {
                    console.error('清空数据失败:', error);
                    showToast('清空数据失败');
                }
            }
        }

        // 开始开奖
        function startDrawing() {
            if (lotteryData.status !== 'registering') {
                showToast('当前状态不允许开奖');
                return;
            }
            
            if (lotteryData.participants.length === 0) {
                showToast('没有报名人员');
                return;
            }
            
            lotteryData.status = 'drawing';
            saveLotteryData();
            showToast('开奖已开始');
        }

        // 重置抽奖
        function resetLottery() {
            if (confirm('确定要重置抽奖吗？所有数据将被清空。')) {
                lotteryData = {
                    participants: [],
                    winners: [],
                    status: 'registering',
                    lastUpdated: new Date().toISOString()
                };
                saveLotteryData();
                showToast('抽奖已重置');
            }
        }

        // 显示提示
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 2000);
        }
    </script>
</body>
</html>
