<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>初中生十条好习惯 - 课件</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 720px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    overflow: hidden;
    position: relative;
  }
  .bg-circle {
    position: absolute;
    border-radius: 50%;
    opacity: 0.1;
    background: #fff;
  }
  .bg-circle:nth-child(1) { width: 300px; height: 300px; top: -80px; right: -50px; }
  .bg-circle:nth-child(2) { width: 200px; height: 200px; bottom: -60px; left: -40px; }
  .bg-circle:nth-child(3) { width: 150px; height: 150px; top: 40%; left: 55%; }
  
  .container {
    position: relative;
    z-index: 10;
    padding: 40px 60px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  
  .header {
    text-align: center;
    margin-bottom: 30px;
  }
  .header-icon {
    font-size: 60px;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 15px rgba(255,255,255,0.4));
  }
  .header h1 {
    font-size: 48px;
    font-weight: 900;
    letter-spacing: 5px;
    text-shadow: 0 3px 15px rgba(0,0,0,0.2);
  }
  .divider {
    width: 150px;
    height: 3px;
    background: rgba(255,255,255,0.5);
    border-radius: 2px;
    margin: 15px auto;
  }
  
  .habits-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 14px;
    padding: 5px 0;
  }
  
  .habit-card {
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(10px);
    border-radius: 14px;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 14px;
    border: 1px solid rgba(255,255,255,0.15);
    position: relative;
    overflow: hidden;
  }
  .habit-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 4px;
    height: 100%;
    border-radius: 4px 0 0 4px;
  }
  .habit-card:nth-child(10n+1)::before { background: linear-gradient(180deg, #FF6B6B, #ee5a24); }
  .habit-card:nth-child(10n+2)::before { background: linear-gradient(180deg, #4ECDC4, #0abde3); }
  .habit-card:nth-child(10n+3)::before { background: linear-gradient(180deg, #FFE66D, #f9ca24); }
  .habit-card:nth-child(10n+4)::before { background: linear-gradient(180deg, #a8e6cf, #6ab04c); }
  .habit-card:nth-child(10n+5)::before { background: linear-gradient(180deg, #fd79a8, #e84393); }
  .habit-card:nth-child(10n+6)::before { background: linear-gradient(180deg, #74b9ff, #0984e3); }
  .habit-card:nth-child(10n+7)::before { background: linear-gradient(180deg, #dfe6e9, #b2bec3); }
  .habit-card:nth-child(10n+8)::before { background: linear-gradient(180deg, #fdcb6e, #e17055); }
  .habit-card:nth-child(10n+9)::before { background: linear-gradient(180deg, #55efc4, #00b894); }
  .habit-card:nth-child(10n+10)::before { background: linear-gradient(180deg, #a29bfe, #6c5ce7); }
  
  .habit-num {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 900;
    flex-shrink: 0;
    color: #fff;
  }
  .habit-card:nth-child(10n+1) .habit-num { background: linear-gradient(135deg, #FF6B6B, #ee5a24); }
  .habit-card:nth-child(10n+2) .habit-num { background: linear-gradient(135deg, #4ECDC4, #0abde3); }
  .habit-card:nth-child(10n+3) .habit-num { background: linear-gradient(135deg, #FFE66D, #f9ca24); color: #333; }
  .habit-card:nth-child(10n+4) .habit-num { background: linear-gradient(135deg, #a8e6cf, #6ab04c); }
  .habit-card:nth-child(10n+5) .habit-num { background: linear-gradient(135deg, #fd79a8, #e84393); }
  .habit-card:nth-child(10n+6) .habit-num { background: linear-gradient(135deg, #74b9ff, #0984e3); }
  .habit-card:nth-child(10n+7) .habit-num { background: linear-gradient(135deg, #dfe6e9, #b2bec3); color: #333; }
  .habit-card:nth-child(10n+8) .habit-num { background: linear-gradient(135deg, #fdcb6e, #e17055); }
  .habit-card:nth-child(10n+9) .habit-num { background: linear-gradient(135deg, #55efc4, #00b894); }
  .habit-card:nth-child(10n+10) .habit-num { background: linear-gradient(135deg, #a29bfe, #6c5ce7); }
  
  .habit-content { flex: 1; }
  .habit-icon { font-size: 24px; margin-bottom: 3px; }
  .habit-text { font-size: 20px; font-weight: 700; letter-spacing: 1px; }
  
  .footer {
    text-align: center;
    padding-top: 15px;
  }
  .footer .slogan { font-size: 18px; opacity: 0.6; letter-spacing: 6px; }
  .footer .emoji-row { font-size: 26px; margin-top: 8px; letter-spacing: 6px; }
</style>
</head>
<body>
  <div class="bg-circle"></div>
  <div class="bg-circle"></div>
  <div class="bg-circle"></div>
  
  <div class="container">
    <div class="header">
      <div class="header-icon">🌟</div>
      <h1>初中生十条好习惯</h1>
      <div class="divider"></div>
    </div>
    
    <div class="habits-grid">

      <div class="habit-card">

      <div class="habit-card">
        <div class="habit-num">04</div>
        <div class="habit-content">
          <div class="habit-icon">🤫</div>
          <div class="habit-text">课间文明休息</div>
        </div>
      </div>
      <div class="habit-card">
        <div class="habit-num">05</div>
        <div class="habit-content">
          <div class="habit-icon">🏃</div>
          <div class="habit-text">认真做好两操</div>
        </div>
      </div>
      <div class="habit-card">
        <div class="habit-num">06</div>
        <div class="habit-content">
          <div class="habit-icon">📚</div>
          <div class="habit-text">上课认真听讲</div>
        </div>
      </div>
      <div class="habit-card">
        <div class="habit-num">07</div>
        <div class="habit-content">
          <div class="habit-icon">✍️</div>
          <div class="habit-text">按时上交作业</div>
        </div>
      </div>
      <div class="habit-card">
        <div class="habit-num">08</div>
        <div class="habit-content">
          <div class="habit-icon">🤝</div>
          <div class="habit-text">团结友爱同学</div>
        </div>
      </div>
      <div class="habit-card">

      </div>
      <div class="habit-card">

      </div>
    </div>
    
    <div class="footer">
      <div class="slogan">积 极 向 上 · 健 康 成 长</div>
      <div class="emoji-row">🌱 📖 🎯 🌈 ⭐</div>
    </div>
  </div>
</body>
</html>
