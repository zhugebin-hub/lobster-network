<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>初中生十条好习惯 - 海报</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1920px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #fff;
    overflow: hidden;
    position: relative;
  }
  
  .bg-pattern {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background-image: 
      radial-gradient(circle at 20% 80%, rgba(255,107,107,0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(78,205,196,0.15) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(255,230,109,0.1) 0%, transparent 40%);
  }
  
  .container {
    position: relative;
    z-index: 10;
    padding: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  
  .header {
    text-align: center;
    padding: 35px 40px 20px;
    position: relative;
  }
  .header::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  }
  .header-icon {
    font-size: 65px;
    margin-bottom: 10px;
    filter: drop-shadow(0 0 25px rgba(255,200,0,0.5));
  }
  .header h1 {
    font-size: 60px;
    font-weight: 900;
    letter-spacing: 8px;
    background: linear-gradient(135deg, #FFE66D, #FF6B6B, #4ECDC4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }
  .header .subtitle {
    font-size: 24px;
    color: rgba(255,255,255,0.6);
    letter-spacing: 15px;
    font-weight: 400;
  }
  
  .content {
    flex: 1;
    padding: 20px 30px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  
  .habits-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    height: 100%;
  }
  
  .habit-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 20px;
    border: 2px solid rgba(255,255,255,0.12);
    position: relative;
    overflow: hidden;
    aspect-ratio: 1 / 1;
    text-align: center;
  }
  
  .habit-item:nth-child(1) { border-color: rgba(255,107,107,0.4); }
  .habit-item:nth-child(2) { border-color: rgba(78,205,196,0.4); }
  .habit-item:nth-child(3) { border-color: rgba(255,230,109,0.4); }
  .habit-item:nth-child(4) { border-color: rgba(168,230,207,0.4); }
  .habit-item:nth-child(5) { border-color: rgba(253,121,168,0.4); }
  .habit-item:nth-child(6) { border-color: rgba(116,185,255,0.4); }
  .habit-item:nth-child(7) { border-color: rgba(99,110,114,0.4); }
  .habit-item:nth-child(8) { border-color: rgba(253,203,110,0.4); }
  .habit-item:nth-child(9) { border-color: rgba(85,239,196,0.4); }
  .habit-item:nth-child(10) { border-color: rgba(162,155,254,0.4); }
  
  .habit-icon {
    font-size: 52px;
    margin-bottom: 10px;
  }
  .habit-num {
    font-size: 22px;
    font-weight: 700;
    color: rgba(255,255,255,0.5);
    margin-bottom: 8px;
    letter-spacing: 2px;
  }
  .habit-text {
    font-size: 40px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 4px;
    line-height: 1.3;
  }
  
  .footer {
    text-align: center;
    padding: 15px 40px 35px;
    position: relative;
  }
  .footer::before {
    content: '';
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  }
  .footer .slogan {
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 10px;
    background: linear-gradient(135deg, #FFE66D, #4ECDC4);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 10px;
  }
  .footer .emoji-row {
    font-size: 34px;
    letter-spacing: 14px;
    filter: drop-shadow(0 0 10px rgba(255,255,255,0.3));
  }
</style>
</head>
<body>
  <div class="bg-pattern"></div>
  
  <div class="container">
    <div class="header">
      <div class="header-icon">🌟</div>
      <h1>初中生十条好习惯</h1>
      <div class="subtitle">好 习 惯 伴 我 成 长</div>
    </div>
    
    <div class="content">
      <div class="habits-grid">
        <div class="habit-item">
          <div class="habit-num">01</div>
          <div class="habit-icon">👋</div>
          <div class="habit-text">见老师问声好</div>
        </div>
        <div class="habit-item">
          <div class="habit-num">02</div>
          <div class="habit-icon">🧹</div>
          <div class="habit-text">保持环境整洁</div>
        </div>
        <div class="habit-item">
          <div class="habit-num">03</div>
          <div class="habit-icon">🍽️</div>
          <div class="habit-text">文明排队用餐</div>
        </div>
        <div class="habit-item">
          <div class="habit-num">04</div>
          <div class="habit-icon">🤫</div>
          <div class="habit-text">课间文明休息</div>
        </div>
        <div class="habit-item">
          <div class="habit-num">05</div>
          <div class="habit-icon">🏃</div>
          <div class="habit-text">认真做好两操</div>
        </div>
        <div class="habit-item">
          <div class="habit-num">06</div>
          <div class="habit-icon">📚</div>
          <div class="habit-text">上课认真听讲</div>
        </div>
        <div class="habit-item">
          <div class="habit-num">07</div>
          <div class="habit-icon">✍️</div>
          <div class="habit-text">按时上交作业</div>
        </div>
        <div class="habit-item">
          <div class="habit-num">08</div>
          <div class="habit-icon">🤝</div>
          <div class="habit-text">团结友爱同学</div>
        </div>
        <div class="habit-item">
          <div class="habit-num">09</div>
          <div class="habit-icon">💯</div>
          <div class="habit-text">诚实守信践诺</div>
        </div>
        <div class="habit-item">
          <div class="habit-num">10</div>
          <div class="habit-icon">🏫</div>
          <div class="habit-text">爱护学校公物</div>
        </div>
      </div>
    </div>
    
    <div class="footer">
      <div class="slogan">积 极 向 上 · 健 康 成 长</div>
      <div class="emoji-row">🌱 📖 🎯 🌈 ⭐</div>
    </div>
  </div>
</body>
</html>
