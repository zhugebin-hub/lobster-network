<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>初中生十条好习惯 - 课件</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&display=swap');
  
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    width: 1280px;
    height: 720px;
    font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    overflow: hidden;
    position: relative;
  }
  
  /* Decorative shapes */
  .shape {
    position: absolute;
    border-radius: 50%;
    opacity: 0.1;
    background: #fff;
  }
  .shape:nth-child(1) { width: 300px; height: 300px; top: -100px; right: -50px; }
  .shape:nth-child(2) { width: 200px; height: 200px; bottom: -80px; left: -60px; }
  .shape:nth-child(3) { width: 150px; height: 150px; top: 50%; left: 60%; }
  
  .container {
    position: relative;
    z-index: 10;
    padding: 50px 60px;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  
  /* Title slide style */
  .title-slide {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
  }
  .title-slide .icon {
    font-size: 100px;
    margin-bottom: 30px;
    filter: drop-shadow(0 0 30px rgba(255,255,255,0.3));
  }
  .title-slide h1 {
    font-size: 72px;
    font-weight: 900;
    letter-spacing: 10px;
    margin-bottom: 20px;
    text-shadow: 0 4px 20px rgba(0,0,0,0.2);
  }
  .title-slide .subtitle {
    font-size: 28px;
    opacity: 0.8;
    letter-spacing: 8px;
  }
  .title-slide .line {
    width: 120px;
    height: 4px;
    background: rgba(255,255,255,0.6);
    border-radius: 2px;
    margin: 25px auto;
  }
  
  /* Content slide */
  .content-slide {
    display: flex;
    flex-direction: column;
    height: 100%;
  }
  .slide-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 40px;
  }
  .slide-header .num {
    font-size: 60px;
    font-weight: 900;
    opacity: 0.3;
  }
  .slide-header h2 {
    font-size: 48px;
    font-weight: 700;
  }
  .slide-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 30px;
    padding-left: 80px;
  }
  .point {
    display: flex;
    align-items: flex-start;
    gap: 16px;
    font-size: 26px;
    line-height: 1.6;
    opacity: 0.95;
  }
  .point .bullet {
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: rgba(255,255,255,0.6);
    flex-shrink: 0;
    margin-top: 12px;
  }
  
  /* Summary slide */
  .summary-slide {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    text-align: center;
  }
  .summary-slide h2 {
    font-size: 56px;
    font-weight: 900;
    margin-bottom: 50px;
    letter-spacing: 8px;
  }
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
    width: 100%;
    max-width: 1100px;
  }
  .summary-item {
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(10px);
    border-radius: 16px;
    padding: 24px 12px;
    text-align: center;
    border: 1px solid rgba(255,255,255,0.2);
  }
  .summary-item .emoji {
    font-size: 40px;
    margin-bottom: 10px;
  }
  .summary-item .text {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
    line-height: 1.4;
  }
  .summary-slide .footer-text {
    margin-top: 50px;
    font-size: 28px;
    opacity: 0.7;
    letter-spacing: 6px;
  }
  
  /* Page number */
  .page-num {
    position: absolute;
    bottom: 25px;
    right: 40px;
    font-size: 16px;
    opacity: 0.4;
  }
</style>
</head>
<body>
  <div class="shape"></div>
  <div class="shape"></div>
  <div class="shape"></div>
  
  <div class="container">
    <!-- 封面 -->
    <div class="title-slide">
      <div class="icon">🌟</div>
      <h1>初中生十条好习惯</h1>
      <div class="line"></div>
      <div class="subtitle">好习惯 · 好未来 · 好人生</div>
    </div>
    
    <div class="page-num">1 / 4</div>
  </div>
</body>
</html>
