<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小龙虾网络 · 学习项目仪表盘</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0a0e17;--card:#111827;--border:#1e293b;--text:#e2e8f0;--dim:#64748b;--accent:#fbbf24;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--purple:#a855f7;--orange:#f97316;--cyan:#06b6d4;--pink:#ec4899}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .header{background:linear-gradient(135deg,#111827 0%,#1e1b4b 100%);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center}
  .header h1{font-size:20px;color:var(--accent);display:flex;align-items:center;gap:8px}
  .header h1 .icon{font-size:24px}
  .global-stats{display:flex;gap:24px}
  .global-stat{text-align:center;padding:4px 16px;border-left:1px solid var(--border)}
  .global-stat:first-child{border-left:none}
  .global-stat .val{font-size:22px;font-weight:700;color:var(--accent)}
  .global-stat .label{font-size:11px;color:var(--dim)}
  .layout{display:grid;grid-template-columns:320px 1fr;gap:0;min-height:calc(100vh - 60px)}
  .sidebar{background:var(--card);border-right:1px solid var(--border);padding:16px;overflow-y:auto;max-height:calc(100vh - 60px)}
  .main{padding:16px;overflow-y:auto;max-height:calc(100vh - 60px)}
  .section{margin-bottom:20px}
  .section-title{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:6px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;transition:all .2s}
  .card:hover{border-color:var(--accent);box-shadow:0 0 20px rgba(251,191,36,.1)}
  .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
  .card-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
  .badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
  .badge-green{background:rgba(34,197,94,.15);color:var(--green)}
  .badge-red{background:rgba(239,68,68,.15);color:var(--red)}
  .badge-yellow{background:rgba(251,191,36,.15);color:var(--accent)}
  .badge-blue{background:rgba(59,130,246,.15);color:var(--blue)}
  .badge-purple{background:rgba(168,85,247,.15);color:var(--purple)}
  .badge-orange{background:rgba(249,115,22,.15);color:var(--orange)}
  .progress-group{margin-bottom:10px}
  .progress-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
  .progress-label .name{color:var(--dim)}
  .progress-label .val{color:var(--text);font-weight:600}
  .progress-bar{height:6px;background:#1e293b;border-radius:3px;overflow:hidden}
  .progress-fill{height:100%;border-radius:3px;transition:width 1s ease}
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat-box{background:#0f172a;border-radius:8px;padding:10px;text-align:center}
  .stat-box .num{font-size:18px;font-weight:700}
  .stat-box .txt{font-size:10px;color:var(--dim);margin-top:2px}
  .domain-table{width:100%;border-collapse:collapse}
  .domain-table th{background:#0f172a;padding:10px 12px;text-align:left;font-size:12px;color:var(--dim);border-bottom:1px solid var(--border)}
  .domain-table td{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px}
  .domain-table tr:hover{background:rgba(251,191,36,.03)}
  .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
  .status-dot.green{background:var(--green);box-shadow:0 0 6px var(--green)}
  .status-dot.red{background:var(--red);box-shadow:0 0 6px var(--red)}
  .status-dot.yellow{background:var(--accent);box-shadow:0 0 6px var(--accent)}
  .status-dot.blue{background:var(--blue);box-shadow:0 0 6px var(--blue)}
  .strength-weak{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .strength{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:8px;padding:8px 10px}
  .weakness{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:8px;padding:8px 10px}
  .strength .title,.weakness .title{font-size:11px;font-weight:600;margin-bottom:4px}
  .strength .title{color:var(--green)}
  .weakness .title{color:var(--red)}
  .strength .items,.weakness .items{font-size:11px;color:var(--dim)}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .student-tabs{display:flex;gap:6px;margin-bottom:16px}
  .tab{padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;background:#0f172a;border:1px solid var(--border);transition:all .2s}
  .tab.active{background:rgba(251,191,36,.15);border-color:var(--accent);color:var(--accent)}
  .tab:hover{border-color:var(--accent)}
  .mini-chart{display:flex;align-items:flex-end;gap:2px;height:40px;margin-top:8px}
  .mini-bar{flex:1;background:var(--accent);border-radius:2px 2px 0 0;opacity:.7;transition:height .5s}
  .mini-bar:hover{opacity:1}
  .update-time{font-size:11px;color:var(--dim);text-align:right;margin-top:12px}
  .radar-container{display:flex;justify-content:center;padding:10px}
  @media(max-width:1200px){.layout{grid-template-columns:1fr}.sidebar{max-height:none}}
</style>
</head>
<body>

<div class="header">
  <h1><span class="icon">🦞</span> 小龙虾网络 · 学习项目仪表盘</h1>
  <div class="global-stats">
    <div class="global-stat"><div class="val" id="totalStudents">3</div><div class="label">活跃学员</div></div>
    <div class="global-stat"><div class="val" id="totalDomains">10</div><div class="label">学习栏目</div></div>
    <div class="global-stat"><div class="val" id="totalProblems">2,390</div><div class="label">总做题数</div></div>
    <div class="global-stat"><div class="val" id="totalGames">18,432</div><div class="label">总对局数</div></div>
    <div class="global-stat"><div class="val" id="avgScore">72%</div><div class="label">平均正确率</div></div>
  </div>
</div>

<div class="layout">
  <!-- 左侧：学习进度总览 -->
  <div class="sidebar">
    <div class="section">
      <div class="section-title">📚 十大学习栏目</div>
      <table class="domain-table">
        <thead><tr><th>栏目</th><th>状态</th><th>进度</th></tr></thead>
        <tbody id="domainTable"></tbody>
      </table>
    </div>
    <div class="section">
      <div class="section-title">📊 能力雷达</div>
      <div class="card" style="padding:12px">
        <canvas id="radarChart" width="280" height="280"></canvas>
      </div>
    </div>
    <div class="section">
      <div class="section-title">⚡ 训练活跃度 (近7日)</div>
      <div class="card" style="padding:12px">
        <div class="mini-chart" id="activityChart"></div>
        <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-top:4px">
          <span>6/28</span><span>6/29</span><span>6/30</span><span>7/1</span><span>7/2</span><span>7/3</span><span>7/4</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 右侧：学员详情 -->
  <div class="main">
    <div class="student-tabs" id="studentTabs">
      <div class="tab active" data-student="xiaochen">🔵 小陈</div>
      <div class="tab" data-student="zhuguxia">🟢 诸葛虾</div>
      <div class="tab" data-student="qoder">🟣 qoder</div>
    </div>

    <div id="studentContent"></div>
  </div>
</div>

<script>
// ========== 数据定义 ==========
const STUDENTS = {
  xiaochen: {
    name: "小陈 · 信电大虾", id: "xiaochen", color: "#3b82f6",
    type: "稳健型", level: 30, phase: "Phase 2", week: 5, day: 28,
    progress: { intro: 98, beginner: 88, intermediate: 70, advanced: 35 },
    problems: 847, wrongAnswers: 23,
    games: 11056, winRate: 48.3,
    strengths: ["死活基础", "手筋基础", "官子基础"],
    weaknesses: ["定式变化", "终盘计算"],
    abilities: { calc: 0.65, judge: 0.60, layout: 0.55, defense: 0.70, memory: 0.75 },
    domains: { go: 85, ai_ml: 45, cyber: 30, data: 55, network: 40, poster: 20, logic: 60, stock: 15, football: 10, trading: 25 },

    progress: { intro: 98, beginner: 90, intermediate: 80, advanced: 60 },
    problems: 1023, wrongAnswers: 18,
    games: 7376, winRate: 49.6,
    strengths: ["计算速度", "手筋应用", "中盘战斗"],
    weaknesses: ["布局理论", "官子精度"],
    abilities: { calc: 0.70, judge: 0.75, layout: 0.65, defense: 0.80, memory: 0.80 },
    domains: { go: 90, ai_ml: 50, cyber: 35, data: 60, network: 55, poster: 25, logic: 65, stock: 20, football: 15, trading: 30 },
    recentActivity: [18, 22, 15, 0, 0, 0, 0]
  },
  qoder: {
    name: "qoder · 实战工程师", id: "qoder", color: "#a855f7",
    type: "实战型", level: 1级, phase: "Phase 2", week: 5, day: 22,
    progress: { intro: 95, beginner: 85, intermediate: 75, advanced: 65 },
    problems: 520, wrongAnswers: 15,
    games: 42, winRate: 52.4,
    strengths: ["实战对局", "中盘战斗", "代码能力"],
    weaknesses: ["定式记忆", "布局理论"],
    abilities: { calc: 0.60, judge: 0.70, layout: 0.65, defense: 0.80, memory: 0.70 },
    domains: { go: 75, ai_ml: 70, cyber: 60, data: 65, network: 50, poster: 40, logic: 70, stock: 30, football: 25, trading: 35 },
    recentActivity: [5, 8, 12, 0, 0, 0, 0]

};

const DOMAINS = [
  { name: "围棋训练", icon: "⚫", path: "domains/go/", file: "day16_problems.json", date: "6/27", status: "stagnant", pct: 85 },
  { name: "AI/ML", icon: "🤖", path: "domains/ai_ml/problems/", file: "problem_generator.py", date: "6/28", status: "ready", pct: 55 },
  { name: "网络安全", icon: "🔒", path: "domains/cybersecurity/problems/", file: "problem_generator.py", date: "6/28", status: "ready", pct: 42 },
  { name: "数据结构", icon: "📊", path: "domains/data_structure/problems/", file: "problem_generator.py", date: "6/28", status: "ready", pct: 60 },
  { name: "网络协议", icon: "🌐", path: "domains/networking/", file: "progress.json", date: "6/28", status: "active", pct: 50 },
  { name: "海报设计", icon: "🎨", path: "domains/poster/problems/", file: "problem_generator.py", date: "6/28", status: "ready", pct: 28 },
  { name: "通用逻辑", icon: "🧠", path: "domains/learning/problems/", file: "shared_logic_engine.py", date: "6/28", status: "ready", pct: 65 },
  { name: "炒股学习", icon: "📈", path: "domains/learning/problems/", file: "stock_predict_engine.py", date: "6/27", status: "ready", pct: 22 },
  { name: "世界杯预测", icon: "⚽", path: "domains/learning/problems/", file: "football_predict_engine.py", date: "6/28", status: "ready", pct: 17 },
  { name: "交易经济", icon: "💰", path: "domains/learning/trainers/", file: "trading_economy_trainer.py", date: "6/28", status: "ready", pct: 30 }
];

const STATUS_MAP = {
  active: { label: "进行中", class: "badge-green", dot: "green" },
  ready: { label: "就绪", class: "badge-blue", dot: "blue" },
  stagnant: { label: "停滞", class: "badge-red", dot: "red" }
};

// ========== 渲染函数 ==========
function renderDomainTable() {
  const tbody = document.getElementById('domainTable');
  tbody.innerHTML = DOMAINS.map(d => {
    const s = STATUS_MAP[d.status];
    return `<tr>
      <td>${d.icon} ${d.name}</td>
      <td><span class="badge ${s.class}">${s.label}</span></td>
      <td>
        <div style="display:flex;align-items:center;gap:6px">
          <div class="progress-bar" style="flex:1;height:4px"><div class="progress-fill" style="width:${d.pct}%;background:${d.pct>60?'var(--green)':d.pct>30?'var(--accent)':'var(--red)'}"></div></div>
          <span style="font-size:11px;color:var(--dim)">${d.pct}%</span>
        </div>
      </td>
    </tr>`;
  }).join('');
}

function renderStudentContent(id) {
  const s = STUDENTS[id];
  const content = document.getElementById('studentContent');
  content.innerHTML = `
    <!-- 学员概览卡片 -->
    <div class="card" style="border-left:3px solid ${s.color}">
      <div class="card-header">
        <div class="card-title" style="color:${s.color}">${s.name}</div>
        <div style="display:flex;gap:6px">
          <span class="badge badge-${s.type==='加速型'?'green':s.type==='稳健型'?'blue':'purple'}">${s.type}</span>
          <span class="badge badge-yellow">${s.level}</span>
        </div>
      </div>
      <div style="font-size:12px;color:var(--dim);margin-bottom:12px">${s.phase} · Week ${s.week} · Day ${s.day}</div>
      <div class="stats-grid">
        <div class="stat-box"><div class="num" style="color:${s.color}">${s.problems.toLocaleString()}</div><div class="txt">做题数</div></div>
        <div class="stat-box"><div class="num" style="color:var(--red)">${s.wrongAnswers}</div><div class="txt">错题数</div></div>
        <div class="stat-box"><div class="num" style="color:var(--green)">${((s.problems-s.wrongAnswers)/s.problems*100).toFixed(1)}%</div><div class="txt">正确率</div></div>
      </div>
    </div>

    <!-- 训练进度 -->
    <div class="card">
      <div class="section-title">📈 训练阶段进度</div>
      ${Object.entries(s.progress).map(([k,v]) => `
        <div class="progress-group">
          <div class="progress-label"><span class="name">${{intro:'入门',beginner:'初级',intermediate:'中级',advanced:'高级'}[k]}</span><span class="val">${v}%</span></div>
          <div class="progress-bar"><div class="progress-fill" style="width:${v}%;background:${v>80?'var(--green)':v>50?'var(--accent)':'var(--blue)'}"></div></div>
        </div>
      `).join('')}
    </div>

    <div class="two-col">
      <!-- 能力画像 -->
      <div class="card">
        <div class="section-title">🎯 五维能力画像</div>
        ${[
          ['计算力', s.abilities.calc], ['判断力', s.abilities.judge],
          ['布局力', s.abilities.layout], ['防守力', s.abilities.defense],
          ['记忆力', s.abilities.memory]
        ].map(([name, val]) => `
          <div class="progress-group">
            <div class="progress-label"><span class="name">${name}</span><span class="val">${(val*100).toFixed(0)}%</span></div>
            <div class="progress-bar"><div class="progress-fill" style="width:${val*100}%;background:${val>0.7?'var(--green)':val>0.5?'var(--accent)':'var(--red)'}"></div></div>
          </div>
        `).join('')}
      </div>

      <!-- 优势/劣势 -->
      <div class="card">
        <div class="section-title">💪 优势与劣势</div>
        <div class="strength-weak">
          <div class="strength">
            <div class="title">✅ 优势领域</div>
            <div class="items">${s.strengths.join(' · ')}</div>
          </div>
          <div class="weakness">
            <div class="title">⚠️ 待提升</div>
            <div class="items">${s.weaknesses.join(' · ')}</div>
          </div>
        </div>
        <div style="margin-top:16px">
          <div class="section-title">🎮 对局统计</div>
          <div class="stats-grid">
            <div class="stat-box"><div class="num" style="color:${s.color}">${s.games.toLocaleString()}</div><div class="txt">总对局</div></div>
            <div class="stat-box"><div class="num" style="color:var(--green)">${s.winRate}%</div><div class="txt">胜率</div></div>
            <div class="stat-box"><div class="num" style="color:var(--orange)">12</div><div class="txt">深夜训练</div></div>

    <!-- 各栏目学习进度 -->

          }).join('')}
        </tbody>
      </table>
    </div>

    <div class="update-time">最后更新：${new Date().toLocaleString('zh-CN')} | 数据源：lobster-network/docs/daily_reports/</div>
  `;
}

function renderRadar() {
  const canvas = document.getElementById('radarChart');
  const ctx = canvas.getContext('2d');
  const cx = 140, cy = 140, r = 110;
  const labels = ['计算力', '判断力', '布局力', '防守力', '记忆力'];
  const keys = ['calc', 'judge', 'layout', 'defense', 'memory'];
  const n = labels.length;

  ctx.clearRect(0, 0, 280, 280);

  // 网格
  for (let level = 1; level <= 5; level++) {
    const lr = r * level / 5;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      const x = cx + lr * Math.cos(angle);
      const y = cy + lr * Math.sin(angle);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 轴线
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
    ctx.strokeStyle = '#1e293b';
    ctx.stroke();
  }

  // 标签
  ctx.font = '11px sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'center';
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const lx = cx + (r + 18) * Math.cos(angle);
    const ly = cy + (r + 18) * Math.sin(angle);
    ctx.fillText(labels[i], lx, ly + 4);
  }

  // 数据 - 三个学员
  const colors = ['#3b82f6', '#22c55e', '#a855f7'];
  const studentIds = ['xiaochen', 'zhuguxia', 'qoder'];

  studentIds.forEach((sid, si) => {
    const s = STUDENTS[sid];
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const idx = i % n;
      const angle = (Math.PI * 2 * idx / n) - Math.PI / 2;
      const val = s.abilities[keys[idx]];
      const x = cx + r * val * Math.cos(angle);
      const y = cy + r * val * Math.sin(angle);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = colors[si];
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = colors[si] + '33';
    ctx.fill();
  });

  // 图例
  ctx.font = '11px sans-serif';
  studentIds.forEach((sid, si) => {
    const x = 20 + si * 90;
    ctx.fillStyle = colors[si];
    ctx.fillRect(x, 265, 10, 10);
    ctx.fillText(STUDENTS[sid].name.split('·')[0].trim(), x + 14, 274);
  });
}

function renderActivityChart() {
  const chart = document.getElementById('activityChart');
  const days = [7, 12, 8, 3, 0, 0, 0]; // 综合活跃度
  const max = Math.max(...days);
  chart.innerHTML = days.map(v =>
    `<div class="mini-bar" style="height:${(v/max*100)||2}%;background:${v>5?'var(--green)':v>0?'var(--accent)':'var(--red)'}"></div>`
  ).join('');
}

// ========== 事件绑定 ==========
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    renderStudentContent(tab.dataset.student);
  });
});

renderDomainTable();
renderStudentContent('xiaochen');
renderRadar();
renderActivityChart();

  document.querySelector('.update-time') && (document.querySelector('.update-time').textContent = `最后更新：${new Date().toLocaleString('zh-CN')} | 数据源：lobster-network/docs/daily_reports/`);
}, 60000);
</script>
