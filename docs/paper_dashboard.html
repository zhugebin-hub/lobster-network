<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📝 小龙虾网络 · 论文撰写仪表盘</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0a0e17;--card:#111827;--border:#1e293b;--text:#e2e8f0;--dim:#64748b;--accent:#fbbf24;--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--purple:#a855f7;--orange:#f97316;--cyan:#06b6d4;--pink:#ec4899}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
  .header{background:linear-gradient(135deg,#111827 0%,#1e1b4b 100%);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
  .header h1{font-size:20px;color:var(--accent);display:flex;align-items:center;gap:8px}
  .global-stats{display:flex;gap:24px;flex-wrap:wrap}
  .global-stat{text-align:center;padding:4px 16px;border-left:1px solid var(--border)}
  .global-stat:first-child{border-left:none}
  .global-stat .val{font-size:22px;font-weight:700;color:var(--accent)}
  .global-stat .label{font-size:11px;color:var(--dim)}
  .layout{display:grid;grid-template-columns:320px 1fr;gap:0;min-height:calc(100vh - 60px)}
  .sidebar{background:var(--card);border-right:1px solid var(--border);padding:16px;overflow-y:auto;max-height:calc(100vh - 60px)}
  .main{padding:16px;overflow-y:auto;max-height:calc(100vh - 60px)}
  .section{margin-bottom:20px}
  .section-title{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:12px;display:flex;align-items:center;gap:6px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:12px;transition:all .2s}
  .card:hover{border-color:var(--accent);box-shadow:0 0 20px rgba(251,191,36,.1)}
  .badge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600}
  .badge-green{background:rgba(34,197,94,.15);color:var(--green)}
  .badge-red{background:rgba(239,68,68,.15);color:var(--red)}
  .badge-yellow{background:rgba(251,191,36,.15);color:var(--accent)}
  .badge-blue{background:rgba(59,130,246,.15);color:var(--blue)}
  .badge-purple{background:rgba(168,85,247,.15);color:var(--purple)}
  .progress-group{margin-bottom:10px}
  .progress-label{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
  .progress-label .name{color:var(--dim)}
  .progress-label .val{color:var(--text);font-weight:600}
  .progress-bar{height:6px;background:#1e293b;border-radius:3px;overflow:hidden}
  .progress-fill{height:100%;border-radius:3px;transition:width 1s ease}
  .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
  .stat-box{background:#0f172a;border-radius:8px;padding:10px;text-align:center}
  .stat-box .num{font-size:18px;font-weight:700}
  .stat-box .txt{font-size:10px;color:var(--dim);margin-top:2px}
  .student-tabs{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
  .tab{padding:8px 16px;border-radius:8px;font-size:13px;cursor:pointer;background:#0f172a;border:1px solid var(--border);transition:all .2s}
  .tab.active{background:rgba(251,191,36,.15);border-color:var(--accent);color:var(--accent)}
  .tab:hover{border-color:var(--accent)}
  .btn{padding:6px 14px;border-radius:8px;font-size:12px;border:1px solid var(--border);background:#0f172a;color:var(--text);cursor:pointer;transition:all .2s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn-primary{background:rgba(251,191,36,.2);border-color:var(--accent);color:var(--accent)}
  .btn-primary:hover{background:rgba(251,191,36,.3)}
  .btn-success{background:rgba(34,197,94,.2);border-color:var(--green);color:var(--green)}
  .btn-success:hover{background:rgba(34,197,94,.3)}
  .btn-danger{background:rgba(239,68,68,.2);border-color:var(--red);color:var(--red)}
  .btn-danger:hover{background:rgba(239,68,68,.3)}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .paper-list{max-height:400px;overflow-y:auto}
  .paper-item{padding:10px;border-bottom:1px solid #1e293b;display:flex;justify-content:space-between;align-items:center}
  .paper-item:hover{background:rgba(251,191,36,.03)}
  .paper-title{font-size:13px;font-weight:600}
  .paper-meta{font-size:11px;color:var(--dim)}
  .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.7);z-index:1000;justify-content:center;align-items:center}
  .modal.active{display:flex}
  .modal-content{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:600px;width:90%;max-height:80vh;overflow-y:auto}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .modal-header h3{color:var(--accent)}
  .close-btn{background:none;border:none;color:var(--dim);font-size:20px;cursor:pointer}
  .form-group{margin-bottom:12px}
  .form-group label{display:block;font-size:12px;color:var(--dim);margin-bottom:4px}
  .form-group input,.form-group select,.form-group textarea{width:100%;padding:8px;border-radius:6px;border:1px solid var(--border);background:#0f172a;color:var(--text);font-size:13px}
  .form-group textarea{min-height:100px;resize:vertical}
  .skill-bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .skill-bar .label{width:100px;font-size:11px;color:var(--dim)}
  .skill-bar .bar{flex:1;height:8px;background:#1e293b;border-radius:4px;overflow:hidden}
  .skill-bar .fill{height:100%;border-radius:4px;transition:width .5s}
  .skill-bar .value{width:40px;text-align:right;font-size:11px;font-weight:600}
  .match-card{background:#0f172a;border-radius:8px;padding:12px;margin-bottom:8px;border:1px solid var(--border)}
  .match-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .match-name{font-size:13px;font-weight:600}
  .match-score{font-size:12px;color:var(--accent)}
  .match-skills{display:flex;gap:8px;font-size:11px}
  .match-skills .teach{color:var(--green)}
  .match-skills .learn{color:var(--orange)}
  .update-time{font-size:11px;color:var(--dim);text-align:right;margin-top:12px}
  .loading{text-align:center;padding:40px;color:var(--dim);font-size:14px}
  .loading::before{content:'📝';font-size:32px;display:block;margin-bottom:8px}
  @media(max-width:1200px){.layout{grid-template-columns:1fr}.sidebar{max-height:none}}
</style>
</head>
<body>

<div class="header">
  <h1>📝 小龙虾网络 · 论文撰写仪表盘</h1>
  <div class="global-stats" id="globalStats">
    <div class="global-stat"><div class="val">-</div><div class="label">学员</div></div>
    <div class="global-stat"><div class="val">-</div><div class="label">论文</div></div>
    <div class="global-stat"><div class="val">-</div><div class="label">评审</div></div>
    <div class="global-stat"><div class="val">-</div><div class="label">学习任务</div></div>
  </div>
</div>

<div class="layout">
  <div class="sidebar">
    <div class="section">
      <div class="section-title">👥 学员列表</div>
      <div id="studentList"></div>
    </div>
    <div class="section">
      <div class="section-title">📊 能力雷达</div>
      <div class="card" style="padding:12px">
        <canvas id="radarChart" width="280" height="280"></canvas>
      </div>
    </div>
    <div class="section">
      <div class="section-title">🤝 学习伙伴匹配</div>
      <div id="matchList"></div>
    </div>
  </div>

  <div class="main">
    <div class="student-tabs" id="studentTabs"></div>
    <div id="studentContent"><div class="loading">数据加载中...</div></div>
  </div>
</div>

<!-- 创建论文弹窗 -->
<div class="modal" id="createPaperModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>📝 创建新论文</h3>
      <button class="close-btn" onclick="closeModal('createPaperModal')">×</button>
    </div>
    <div class="form-group">
      <label>论文标题</label>
      <input type="text" id="paperTitle" placeholder="输入论文标题">
    </div>
    <div class="form-group">
      <label>论文类型</label>
      <select id="paperType">
        <option value="academic">学术论文</option>
        <option value="technical">技术报告</option>
        <option value="learning">学习总结</option>
      </select>
    </div>
    <div class="form-group">
      <label>作者</label>
      <select id="paperAuthor"></select>
    </div>
    <div class="form-group">
      <label>协作学员（多选）</label>
      <div id="paperCollaborators"></div>
    </div>
    <button class="btn btn-primary" onclick="createPaper()">创建论文</button>
  </div>
</div>

<!-- 评审论文弹窗 -->
<div class="modal" id="reviewModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>📋 评审论文</h3>
      <button class="close-btn" onclick="closeModal('reviewModal')">×</button>
    </div>
    <div id="reviewPaperInfo"></div>
    <div class="form-group">
      <label>评审者</label>
      <select id="reviewerSelect"></select>
    </div>
    <div id="reviewScores"></div>
    <div class="form-group">
      <label>评语</label>
      <textarea id="reviewComments" placeholder="输入详细评语..."></textarea>
    </div>
    <button class="btn btn-success" onclick="submitReview()">提交评审</button>
  </div>
</div>

<div class="update-time" id="updateTime">正在连接 API...</div>

<script>
let currentStudent = null;
let students = {};
let papers = [];
let reviews = [];

// ============================================================
// API 调用
// ============================================================

async function fetchData() {
  try {
    const [studentsRes, papersRes, statsRes] = await Promise.all([
      fetch('/api/students'),
      fetch('/api/papers'),
      fetch('/api/stats')
    ]);
    
    students = await studentsRes.json();
    papers = await papersRes.json();
    const stats = await statsRes.json();
    
    renderGlobalStats(stats);
    renderStudentTabs();
    renderStudentList();
    renderPaperList();
    renderRadar();
    
    if (currentStudent) {
      renderStudentContent(currentStudent);
    } else {
      const firstId = Object.keys(students)[0];
      if (firstId) switchStudent(firstId);
    }
    
    document.getElementById('updateTime').textContent = `最后更新：${new Date().toLocaleString('zh-CN')}`;
  } catch(e) {
    document.getElementById('updateTime').textContent = '⚠️ API连接失败: ' + e.message;
  }
}

function renderGlobalStats(stats) {
  document.getElementById('globalStats').innerHTML = `
    <div class="global-stat"><div class="val">${stats.total_students}</div><div class="label">学员</div></div>
    <div class="global-stat"><div class="val">${stats.total_papers}</div><div class="label">论文</div></div>
    <div class="global-stat"><div class="val">${stats.total_reviews}</div><div class="label">评审</div></div>
    <div class="global-stat"><div class="val">${stats.learning_tasks}</div><div class="label">学习任务</div></div>
  `;
}

function renderStudentTabs() {
  document.getElementById('studentTabs').innerHTML = `
    ${Object.values(students).map(s => `
      <div class="tab ${s.student_id === currentStudent ? 'active' : ''}" data-student="${s.student_id}" onclick="switchStudent('${s.student_id}')">
        ${s.name}
      </div>
    `).join('')}
    <button class="btn btn-primary" onclick="openModal('createPaperModal')">+ 创建论文</button>
  `;
}

function renderStudentList() {
  document.getElementById('studentList').innerHTML = Object.values(students).map(s => `
    <div class="card" style="padding:10px;cursor:pointer;border-left:3px solid ${s.student_id === 'hermes' ? 'var(--accent)' : s.student_id === 'xiaochen' ? 'var(--blue)' : s.student_id === 'zhuguxia' ? 'var(--green)' : 'var(--purple)'}" onclick="switchStudent('${s.student_id}')">
      <div style="font-size:13px;font-weight:600">${s.name}</div>
      <div style="font-size:11px;color:var(--dim)">${s.role}</div>
      <div style="display:flex;justify-content:space-between;margin-top:6px;font-size:11px">
        <span>论文: ${s.papers_written}</span>
        <span>评审: ${s.papers_reviewed}</span>
        <span>均分: ${s.average_score}</span>
      </div>
    </div>
  `).join('');
}

function switchStudent(id) {
  currentStudent = id;
  renderStudentTabs();
  renderStudentContent(id);
  renderMatches(id);
}

async function renderStudentContent(id) {
  if (!id || !students[id]) return;
  const s = students[id];
  const content = document.getElementById('studentContent');
  
  // 获取学员详情
  try {
    const res = await fetch(`/api/student/${id}`);
    const detail = await res.json();
    
    content.innerHTML = `
      <!-- 学员概览 -->
      <div class="card" style="border-left:3px solid ${id === 'hermes' ? 'var(--accent)' : id === 'xiaochen' ? 'var(--blue)' : id === 'zhuguxia' ? 'var(--green)' : 'var(--purple)'}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
          <div>
            <div style="font-size:18px;font-weight:700">${s.name}</div>
            <div style="font-size:12px;color:var(--dim)">${s.role}</div>
          </div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-primary" onclick="generateLearningPlan('${id}')">📋 生成学习计划</button>
            <button class="btn btn-success" onclick="openReviewModal()">📝 评审论文</button>
          </div>
        </div>
        <div class="stats-grid">
          <div class="stat-box"><div class="num" style="color:var(--accent)">${s.papers_written}</div><div class="txt">发表论文</div></div>
          <div class="stat-box"><div class="num" style="color:var(--green)">${s.papers_reviewed}</div><div class="txt">评审次数</div></div>
          <div class="stat-box"><div class="num" style="color:var(--cyan)">${s.average_score}</div><div class="txt">平均得分</div></div>
        </div>
      </div>

      <!-- 能力画像 -->
      <div class="two-col">
        <div class="card">
          <div class="section-title">🎯 写作能力画像</div>
          ${Object.entries(s.skills).map(([skill, value]) => `
            <div class="skill-bar">
              <span class="label">${skill.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase())}</span>
              <div class="bar"><div class="fill" style="width:${value*100}%;background:${value>0.7?'var(--green)':value>0.5?'var(--accent)':'var(--red)'}"></div></div>
              <span class="value">${(value*100).toFixed(0)}%</span>
            </div>
          `).join('')}
        </div>

        <div class="card">
          <div class="section-title">💪 优势与劣势</div>
          <div style="margin-bottom:12px">
            <div style="font-size:12px;color:var(--green);margin-bottom:4px">✅ 优势领域</div>
            <div style="font-size:12px;color:var(--dim)">${s.strengths.length > 0 ? s.strengths.map(s => s.replace(/_/g, ' ')).join(' · ') : '暂无'}</div>
          </div>
          <div>
            <div style="font-size:12px;color:var(--red);margin-bottom:4px">⚠️ 待提升领域</div>
            <div style="font-size:12px;color:var(--dim)">${s.weaknesses.length > 0 ? s.weaknesses.map(w => w.replace(/_/g, ' ')).join(' · ') : '暂无'}</div>
          </div>
        </div>
      </div>

      <!-- 论文列表 -->
      <div class="card">
        <div class="section-title">📄 论文列表</div>
        <div class="paper-list">
          ${papers.filter(p => p.author === id || (p.collaborators && p.collaborators.includes(id))).map(p => `
            <div class="paper-item">
              <div>
                <div class="paper-title">${p.title}</div>
                <div class="paper-meta">${p.type} · ${p.section_count}章节 · ${p.review_count}评审 · 得分: ${p.score}</div>
              </div>
              <div style="display:flex;gap:4px">
                <span class="badge ${p.status === 'published' ? 'badge-green' : p.status === 'review' ? 'badge-yellow' : 'badge-blue'}">${p.status}</span>
              </div>
            </div>
          `).join('') || '<div style="text-align:center;padding:20px;color:var(--dim)">暂无论文</div>'}
        </div>
      </div>
    `;
  } catch(e) {
    content.innerHTML = `<div class="card">加载失败: ${e.message}</div>`;
  }
}

function renderPaperList() {
  // 侧边栏不需要单独渲染论文列表，在主内容区已显示
}

function renderRadar() {
  const canvas = document.getElementById('radarChart');
  const ctx = canvas.getContext('2d');
  const cx = 140, cy = 140, r = 110;
  
  const skills = [
    '标题', '摘要', '文献', '方法', '实验',
    '数据', '论证', '语言', '批判', '引用'
  ];
  const skillKeys = Object.keys(students[Object.keys(students)[0]]?.skills || {});
  const n = skillKeys.length;

  ctx.clearRect(0, 0, 280, 280);

  // 网格
  for (let level = 1; level <= 5; level++) {
    const lr = r * level / 5;
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
      const x = cx + lr * Math.cos(angle);
      const y = cy + lr * Math.sin(angle);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // 轴线
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + r * Math.cos(angle), cy + r * Math.sin(angle));
    ctx.strokeStyle = '#1e293b';
    ctx.stroke();
  }

  // 标签
  ctx.font = '10px sans-serif';
  ctx.fillStyle = '#94a3b8';
  ctx.textAlign = 'center';
  for (let i = 0; i < n; i++) {
    const angle = (Math.PI * 2 * i / n) - Math.PI / 2;
    const lx = cx + (r + 14) * Math.cos(angle);
    const ly = cy + (r + 14) * Math.sin(angle);
    ctx.fillText(skills[i], lx, ly + 3);
  }

  // 数据
  const colors = ['#3b82f6', '#22c55e', '#a855f7', '#fbbf24'];
  const studentIds = Object.keys(students);

  studentIds.forEach((sid, si) => {
    const s = students[sid];
    ctx.beginPath();
    for (let i = 0; i <= n; i++) {
      const idx = i % n;
      const angle = (Math.PI * 2 * idx / n) - Math.PI / 2;
      const val = s.skills[skillKeys[idx]] || 0.5;
      const x = cx + r * val * Math.cos(angle);
      const y = cy + r * val * Math.sin(angle);
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.strokeStyle = colors[si];
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = colors[si] + '22';
    ctx.fill();
  });

  // 图例
  ctx.font = '10px sans-serif';
  studentIds.forEach((sid, si) => {
    const x = 10 + si * 70;
    ctx.fillStyle = colors[si];
    ctx.fillRect(x, 265, 8, 8);
    ctx.fillText(students[sid].name, x + 10, 273);
  });
}

async function renderMatches(studentId) {
  try {
    const res = await fetch(`/api/match/${studentId}`);
    const matches = await res.json();
    
    document.getElementById('matchList').innerHTML = matches.length > 0 ? matches.map(m => `
      <div class="match-card">
        <div class="match-header">
          <span class="match-name">${students[m.student_id]?.name || m.student_id}</span>
          <span class="match-score">互补度: ${(m.complementarity_score * 100).toFixed(0)}%</span>
        </div>
        <div class="match-skills">
          <span class="teach">📚 可教: ${m.can_teach.map(s => s.replace(/_/g, ' ')).join(', ')}</span>
          <span class="learn">🎯 可学: ${m.can_learn.map(s => s.replace(/_/g, ' ')).join(', ')}</span>
        </div>
      </div>
    `).join('') : '<div style="text-align:center;padding:10px;color:var(--dim);font-size:12px">暂无匹配</div>';
  } catch(e) {
    document.getElementById('matchList').innerHTML = '<div style="text-align:center;padding:10px;color:var(--red);font-size:12px">加载失败</div>';
  }
}

// ============================================================
// 操作函数
// ============================================================

function openModal(id) {
  document.getElementById(id).classList.add('active');
  
  if (id === 'createPaperModal') {
    // 填充作者下拉
    document.getElementById('paperAuthor').innerHTML = Object.values(students).map(s => 
      `<option value="${s.student_id}">${s.name}</option>`
    ).join('');
    
    // 填充协作学员
    document.getElementById('paperCollaborators').innerHTML = Object.values(students).map(s => 
      `<label style="display:flex;align-items:center;gap:6px;margin-bottom:4px;font-size:12px">
        <input type="checkbox" value="${s.student_id}"> ${s.name}
      </label>`
    ).join('');
  }
  
  if (id === 'reviewModal') {
    // 填充评审者
    document.getElementById('reviewerSelect').innerHTML = Object.values(students).map(s => 
      `<option value="${s.student_id}">${s.name}</option>`
    ).join('');
    
    // 填充评分维度
    document.getElementById('reviewScores').innerHTML = [
      {id: 'content', name: '内容质量', weight: 0.30},
      {id: 'structure', name: '结构完整', weight: 0.20},
      {id: 'language', name: '语言表达', weight: 0.20},
      {id: 'depth', name: '深度广度', weight: 0.15},
      {id: 'originality', name: '原创性', weight: 0.15}
    ].map(dim => `
      <div class="form-group">
        <label>${dim.name} (权重: ${dim.weight})</label>
        <input type="range" id="score_${dim.id}" min="0" max="100" value="70" 
               oninput="document.getElementById('val_${dim.id}').textContent=this.value+'%'">
        <span id="val_${dim.id}" style="font-size:12px;color:var(--dim)">70%</span>
      </div>
    `).join('');
  }
}

function closeModal(id) {
  document.getElementById(id).classList.remove('active');
}

async function createPaper() {
  const title = document.getElementById('paperTitle').value;
  const type = document.getElementById('paperType').value;
  const author = document.getElementById('paperAuthor').value;
  
  const collaborators = [];
  document.querySelectorAll('#paperCollaborators input:checked').forEach(cb => {
    collaborators.push(cb.value);
  });
  
  if (!title) {
    alert('请输入论文标题');
    return;
  }
  
  try {
    const res = await fetch('/api/paper/create', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({title, type, author, collaborators})
    });
    
    const result = await res.json();
    if (result.status === 'ok') {
      closeModal('createPaperModal');
      fetchData();
      alert('论文创建成功！');
    } else {
      alert('创建失败: ' + result.error);
    }
  } catch(e) {
    alert('请求失败: ' + e.message);
  }
}

async function submitReview() {
  const paperId = 'paper_001'; // 默认评审第一篇
  const reviewerId = document.getElementById('reviewerSelect').value;
  
  const scores = {
    content: parseInt(document.getElementById('score_content').value) / 100,
    structure: parseInt(document.getElementById('score_structure').value) / 100,
    language: parseInt(document.getElementById('score_language').value) / 100,
    depth: parseInt(document.getElementById('score_depth').value) / 100,
    originality: parseInt(document.getElementById('score_originality').value) / 100
  };
  
  const comments = document.getElementById('reviewComments').value;
  
  try {
    const res = await fetch(`/api/paper/${paperId}/review`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({reviewer_id: reviewerId, scores, comments})
    });
    
    const result = await res.json();
    if (result.status === 'ok') {
      closeModal('reviewModal');
      fetchData();
      alert('评审提交成功！');
    } else {
      alert('评审失败: ' + result.error);
    }
  } catch(e) {
    alert('请求失败: ' + e.message);
  }
}

async function generateLearningPlan(studentId) {
  try {
    const res = await fetch(`/api/learning-plan/${studentId}`);
    const plan = await res.json();
    
    if (plan.error) {
      alert('生成失败: ' + plan.error);
      return;
    }
    
    let html = `<h3>📋 ${plan.student_name} 的学习计划</h3>`;
    html += `<p style="color:var(--dim);font-size:12px;margin:8px 0">生成时间: ${plan.generated_at}</p>`;
    html += `<div style="margin:12px 0">`;
    html += `<div style="font-size:12px;color:var(--red);margin-bottom:4px">🎯 重点领域: ${plan.focus_areas.join(', ')}</div>`;
    html += `<div style="font-size:12px;color:var(--green);margin-bottom:8px">✅ 优势领域: ${plan.strengths.join(', ')}</div>`;
    html += `</div>`;
    
    html += `<div style="margin-top:12px">`;
    plan.tasks.forEach(task => {
      html += `<div style="background:#0f172a;border-radius:8px;padding:10px;margin-bottom:8px;border-left:3px solid ${task.priority === 'high' ? 'var(--red)' : 'var(--accent)'}">
        <div style="font-size:13px;font-weight:600">${task.skill_name}</div>
        <div style="font-size:12px;color:var(--dim);margin:4px 0">${task.task}</div>
        <div style="font-size:11px;color:var(--dim)">预计: ${task.estimated_hours}小时</div>
      </div>`;
    });
    html += `</div>`;
    
    // 创建弹窗显示
    const modal = document.createElement('div');
    modal.className = 'modal active';
    modal.innerHTML = `<div class="modal-content">${html}<button class="btn" onclick="this.closest('.modal').remove()" style="margin-top:16px">关闭</button></div>`;
    document.body.appendChild(modal);
    
  } catch(e) {
    alert('生成失败: ' + e.message);
  }
}

function openReviewModal() {
  openModal('reviewModal');
}

fetchData();
setInterval(fetchData, 30000);
</script>
