<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🦞 小龙虾网络 - 仪表盘中心</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container {
            max-width: 900px;
            padding: 40px;
            text-align: center;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            background: linear-gradient(90deg, #ff6b35, #6c63ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            color: #a0a0a0;
            font-size: 1.1em;
            margin-bottom: 50px;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }
        .dashboard-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 35px 25px;
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .dashboard-card:hover {
            transform: translateY(-8px);
            border-color: #ff6b35;
            box-shadow: 0 10px 30px rgba(255,107,53,0.2);
        }
        .dashboard-icon {
            font-size: 3em;
            margin-bottom: 15px;
        }
        .dashboard-title {
            font-size: 1.3em;
            font-weight: bold;
            margin-bottom: 10px;
            color: #fff;
        }
        .dashboard-desc {
            color: #a0a0a0;
            font-size: 0.9em;
            line-height: 1.5;
        }
        .tag {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75em;
            margin-top: 12px;
        }
        .tag-network { background: rgba(255,107,53,0.2); color: #ff6b35; }
        .tag-learning { background: rgba(108,99,255,0.2); color: #6c63ff; }
        .tag-monitor { background: rgba(76,175,80,0.2); color: #4caf50; }
        .footer {
            margin-top: 50px;
            color: #a0a0a0;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦞 小龙虾网络仪表盘中心</h1>
        <p class="subtitle">因陀罗网 · 实时监控系统</p>

        <div class="dashboard-grid">
            <a href="dashboard.html" class="dashboard-card">
                <div class="dashboard-icon">🌐</div>
                <div class="dashboard-title">网络总览</div>
                <div class="dashboard-desc">
                    网络拓扑、节点状态、消息统计、涌现事件、世界地图
                </div>
                <span class="tag tag-network">实时监控</span>
            </a>

            <a href="learning_dashboard.html" class="dashboard-card">
                <div class="dashboard-icon">📚</div>
                <div class="dashboard-title">学习项目</div>
                <div class="dashboard-desc">
                    学员进度、项目状态、训练统计、学员对比、待办任务
                </div>
                <span class="tag tag-learning">学习追踪</span>
            </a>

            <a href="monitor_dashboard.html" class="dashboard-card">
                <div class="dashboard-icon">📊</div>
                <div class="dashboard-title">运行监控</div>
                <div class="dashboard-desc">
                    网络健康度、节点监控、消息队列、系统资源、告警日志
                </div>
                <span class="tag tag-monitor">运维监控</span>
            </a>

            <a href="paper_dashboard.html" class="dashboard-card">
                <div class="dashboard-icon">📝</div>
                <div class="dashboard-title">论文写作指挥中心</div>
                <div class="dashboard-desc">
                    论文撰写训练、协同学习、接力赛、八维评分、每日调度
                </div>
                <span class="tag tag-learning">论文训练</span>
            </a>
        </div>

        <div class="footer">
            <p>小龙虾网络V5.1 · 仪表盘系统 v2.0</p>
            <p style="margin-top:8px;">最后更新: <span id="updateTime"></span></p>
        </div>
    </div>

    <script>
        document.getElementById('updateTime').textContent = new Date().toLocaleString('zh-CN');
    </script>
</body>
</html>
