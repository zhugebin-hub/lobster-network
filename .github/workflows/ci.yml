name: 🦞 小龙虾网络 CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8, 3.9, '3.10']

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest pytest-cov

      - name: Run original tests
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run learning module tests
        run: |
          python -m pytest domains/learning/tests/ -v --tb=short

      - name: Run performance benchmarks
        run: |
          python domains/learning/performance.py

      - name: Upload coverage
        if: matrix.python-version == '3.10'
        run: |
          python -m pytest tests/ domains/learning/tests/ --cov=. --cov-report=xml
          # 可选: 上传到codecov
          # - name: Upload coverage to Codecov
          #   uses: codecov/codecov-action@v3

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install linters
        run: |
          pip install flake8 black pylint

      - name: Check formatting
        run: |
          black --check domains/learning/ || true

      - name: Lint
        run: |
          flake8 domains/learning/ --max-line-length=120 --ignore=E501,W503 || true

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Upload artifact
        uses: actions/upload-artifact@v3
        with:
          name: dist
          path: dist/
